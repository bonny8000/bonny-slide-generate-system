<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<title>Insight · dark hero panel</title>
<link rel="stylesheet" href="../assets/bonny-slide-v2-tokens.css" />

</head>
<body>
<main class="slide" data-mode="dark">

<section class="frame">
  <p class="eyebrow latin">INSIGHT 02</p>
  <h1 class="headline cjk">使用者並非<span class="accent-green">不願意</span>,而是沒有足夠的信心</h1>
  <p class="subtitle latin">Cross-source synthesis · interviews × usability test × analytics</p>

  <div class="content stack" style="gap:36px;">
    <div class="insight-panel">
      <span class="insight-label latin">WHAT WE LEARNED</span>
      <p class="insight-statement cjk">
        三個獨立來源都指向同一個現象 —<br/>
        使用者<span class="highlight">想要嘗試</span>,但缺乏信任訊號讓他們<span class="highlight">敢於行動</span>。
      </p>
      <p class="insight-note cjk">8/12 訪談者主動提到「不知道為什麼」;漏斗數據顯示第二步是流失最大斷點;熱區點擊集中在輔助說明區塊。</p>
      <p class="insight-implication cjk">→ 系統必須在每個推薦旁顯示理由與透明度訊號,而非只是優化排序演算法。</p>
    </div>
  </div>

  <div class="footer-bar">
    <span class="footer-source latin">Synthesis · 2024-09 · 3 evidence sources</span>
    <span class="page-marker latin">05 / 08</span>
  </div>
</section>
</main>
</body>
</html>
