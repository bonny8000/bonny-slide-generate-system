<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" role="img" aria-labelledby="t d"><title id="t">The layer stack</title><desc id="d">Intention selects the form; recipes name slots; hypertokens carry implementation; tokens resolve the theme; base.css renders it.</desc><rect width="1200" height="486" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">LAYERS</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">Only the top layer gets to choose anything</text><text x="80" y="116" font-size="11" font-weight="700" fill="#7C7E92" letter-spacing="1.5">LAYER</text><text x="300" y="116" font-size="11" font-weight="700" fill="#7C7E92" letter-spacing="1.5">WHAT IT DECIDES</text><text x="700" y="116" font-size="11" font-weight="700" fill="#7C7E92" letter-spacing="1.5">ONE TRACE, ALL THE WAY DOWN</text><rect x="56" y="128" width="1088" height="52" rx="14" fill="#E7E8FC" stroke="#7077FB"/><text x="80" y="160" font-size="14" font-weight="700" fill="#2B3040">Intention</text><text x="300" y="160" font-size="12.5" fill="#7C7E92">what this page must DO to the room</text><text x="700" y="160" font-size="12.5" fill="#2B3040">prove the work had impact</text><path d="M112 182v14" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M106 191l6 6 6-6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="56" y="200" width="1088" height="52" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="80" y="232" font-size="14" font-weight="700" fill="#2B3040">Layout &#183; component</text><text x="300" y="232" font-size="12.5" fill="#7C7E92">the form &#8212; 25 layouts, 19 components</text><text x="700" y="232" font-size="12.5" fill="#2B3040">results-grid &#8594; metric-card</text><path d="M112 254v14" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M106 263l6 6 6-6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="56" y="272" width="1088" height="52" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="80" y="304" font-size="14" font-weight="700" fill="#2B3040">Recipe</text><text x="300" y="304" font-size="12.5" fill="#7C7E92">which slots that component has</text><text x="700" y="304" font-size="12.5" fill="#2B3040">root: [surface.card, layout.stack.card]</text><path d="M112 326v14" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M106 335l6 6 6-6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="56" y="344" width="1088" height="52" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="80" y="376" font-size="14" font-weight="700" fill="#2B3040">Hypertoken</text><text x="300" y="376" font-size="12.5" fill="#7C7E92">a reusable implementation fragment</text><text x="700" y="376" font-size="12.5" fill="#2B3040">surface.card &#8594; background: {surface}</text><path d="M112 398v14" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M106 407l6 6 6-6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="56" y="416" width="1088" height="52" rx="14" fill="#2B3040"/><text x="80" y="448" font-size="14" font-weight="700" fill="#FFFFFF">Token</text><text x="300" y="448" font-size="12.5" fill="#B7BCD0">the one active theme resolves the value</text><text x="700" y="448" font-size="12.5" fill="#FFFFFF">--surface: #F1F4F9&#8195;&#183;&#8195;light theme</text></g></svg>
