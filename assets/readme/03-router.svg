<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 262" role="img" aria-labelledby="t d"><title id="t">The router</title><desc id="d">Specs declare intent and triggers; the compiler turns them into a lookup.</desc><rect width="1200" height="262" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">ROUTING</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">Routing is a lookup, not a guess</text><rect x="56" y="110" width="330" height="100" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="78" y="138" font-size="13" font-weight="700" fill="#2B3040">every spec declares</text><text x="78" y="164" font-size="12.5" fill="#7077FB">intent:</text><text x="132" y="164" font-size="12.5" fill="#7C7E92">set expectations over time</text><text x="78" y="188" font-size="12.5" fill="#7077FB">triggers:</text><text x="142" y="188" font-size="12.5" fill="#7C7E92">roadmap &#183; phases &#183; &#26178;&#31243;</text><path d="M386 162h44" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M424 156l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="440" y="110" width="300" height="100" rx="14" fill="#E7E8FC" stroke="#7077FB"/><text x="462" y="138" font-size="13" font-weight="700" fill="#2B3040">compiled into one index</text><text x="462" y="164" font-size="12.5" fill="#7C7E92">system/router.json</text><text x="462" y="188" font-size="12.5" fill="#7C7E92">44 patterns &#183; 206 triggers</text><path d="M740 162h44" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M778 156l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="794" y="110" width="350" height="100" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="816" y="138" font-size="13" font-weight="700" fill="#2B3040">the planner matches on it</text><text x="816" y="164" font-size="12.5" fill="#7C7E92">intention &#8594; layout + components</text><text x="816" y="188" font-size="12.5" fill="#7C7E92">no browsing, no inventing</text><text x="56" y="244" font-size="13" fill="#7C7E92">A pattern that is not in the router <tspan font-weight="700" fill="#2B3040">does not exist</tspan> &#8212; and the build fails if a spec drifts out of it.</text></g></svg>