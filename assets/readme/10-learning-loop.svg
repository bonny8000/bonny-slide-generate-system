<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 412" role="img" aria-labelledby="t d"><title id="t">The learning loop</title><desc id="d">A reference slide is read for five things, deduped against the catalogue, registered into the router, and proved reachable by the compiler.</desc><rect width="1200" height="412" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">TRAINING MODE</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">A pattern the planner cannot reach does not exist</text><rect x="56" y="108" width="254" height="118" rx="14" fill="#E7E8FC" stroke="#7077FB"/><text x="78" y="138" font-size="14" font-weight="700" fill="#2B3040">1 &#183; A reference lands</text><text x="78" y="164" font-size="12" fill="#7C7E92">&#8220;training / &#35347;&#32244;&#8221; plus a slide</text><text x="78" y="184" font-size="12" fill="#7C7E92">or an image to learn from.</text><text x="78" y="210" font-size="12" font-weight="700" fill="#7077FB">No deck is produced.</text><path d="M310 167h24" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M328 161l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="334" y="108" width="254" height="118" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="356" y="138" font-size="14" font-weight="700" fill="#2B3040">2 &#183; Read five things</text><text x="356" y="164" font-size="12" fill="#7C7E92">intention &#183; trigger &#183; layout logic</text><text x="356" y="184" font-size="12" fill="#7C7E92">component craft &#183; the rationale</text><text x="356" y="210" font-size="12" fill="#7077FB">Structure only &#8212; colour as roles.</text><path d="M588 167h24" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M606 161l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="612" y="108" width="254" height="118" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="634" y="138" font-size="14" font-weight="700" fill="#2B3040">3 &#183; Dedupe</text><text x="634" y="164" font-size="12" fill="#7C7E92">against specs/_catalog.md:</text><text x="634" y="184" font-size="12" fill="#7C7E92">existing &#183; variant &#183; new</text><text x="634" y="210" font-size="12" fill="#7077FB">A near-copy extends a spec.</text><path d="M866 167h24" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M884 161l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="890" y="108" width="254" height="118" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="912" y="138" font-size="14" font-weight="700" fill="#2B3040">4 &#183; Register it</text><text x="912" y="164" font-size="12" fill="#7C7E92">intent + triggers frontmatter,</text><text x="912" y="184" font-size="12" fill="#7C7E92">catalogue row, content-map row,</text><text x="912" y="204" font-size="12" fill="#7C7E92">a validated example, CSS in base.css</text><path d="M1144 226V262H186V238" stroke="#7077FB" stroke-width="2" fill="none" stroke-dasharray="5 4"/><path d="M180 246l6-8 6 8" stroke="#7077FB" stroke-width="2" fill="none"/><rect x="470" y="240" width="390" height="20" fill="#FBFBFE"/><text x="665" y="255" font-size="12" font-weight="700" fill="#7077FB" text-anchor="middle">the next deck reaches for it without being told</text><rect x="56" y="292" width="1088" height="62" rx="14" fill="#2B3040"/><text x="80" y="320" font-size="13.5" font-weight="700" fill="#FFFFFF">5 &#183; python scripts/compile_system.py --check</text><text x="80" y="342" font-size="12" fill="#B7BCD0">Fails on a stable layout with no content-map row, an unresolvable dependency, a duplicate trigger, or a trigger in a language the router cannot match. Training is not finished until this passes.</text><text x="56" y="382" font-size="13" fill="#7C7E92">The output of a training run is a change to <tspan font-weight="700" fill="#2B3040">specs/</tspan>, never a slide. If an image arrives with no instruction, ask which mode is meant.</text></g></svg>
