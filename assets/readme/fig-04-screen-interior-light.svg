<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Screen interiors across mobile and website frames</title>
  <desc id="desc">A slender iPhone-like mobile frame and a standard website browser frame use the same light interface vocabulary inside their different containers.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#8994a8" flood-opacity=".09"/></filter>
    <style>
      .navy{fill:#172b4d}.muted{fill:#71809a}.purple{fill:#716cff}.pale{fill:#e9eaff}.ui{fill:#8791a0}.ui-soft{fill:#d8ddea}.frame{fill:#f3f4f6;stroke:#cbd1db;stroke-width:2}.line{stroke:#d9ddec;stroke-width:2}.eyebrow{font:600 15px Arial,sans-serif;letter-spacing:.16em}.title{font:700 28px Arial,"Microsoft JhengHei",sans-serif}.body{font:500 18px Arial,"Microsoft JhengHei",sans-serif}.caption{font:600 14px Arial,sans-serif;letter-spacing:.11em}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="72" y="72" class="eyebrow purple">SCREEN INTERIOR</text>
  <text x="72" y="119" class="title navy">Same system. Different frame.</text>
  <text x="72" y="154" class="body muted">The interior adapts to mobile and web without losing its product rhythm.</text>

  <!-- iPhone-like mobile: 150 × 350, a slender 0.43 ratio -->
  <g filter="url(#shadow)">
    <rect x="125" y="198" width="150" height="350" rx="30" class="frame"/>
    <rect x="132" y="205" width="136" height="336" rx="24" fill="#fff"/>
    <rect x="177" y="214" width="46" height="8" rx="4" fill="#c2c8d2"/>
    <rect x="132" y="242" width="136" height="42" fill="#eef0ff"/>
    <circle cx="148" cy="263" r="8" class="purple"/><rect x="163" y="259" width="38" height="7" rx="4" class="ui"/><rect x="225" y="259" width="25" height="7" rx="4" class="ui-soft"/>
    <rect x="143" y="303" width="39" height="6" rx="3" class="ui"/><rect x="188" y="303" width="30" height="6" rx="3" class="ui-soft"/><rect x="225" y="299" width="28" height="13" rx="7" class="purple"/>
    <rect x="143" y="329" width="116" height="65" rx="12" fill="#fbfbfd" stroke="#eef0f4"/>
    <rect x="143" y="408" width="116" height="65" rx="12" fill="#fbfbfd" stroke="#eef0f4"/>
    <circle cx="157" cy="351" r="10" class="pale"/><circle cx="157" cy="430" r="10" class="pale"/>
    <rect x="174" y="345" width="42" height="7" rx="4" class="ui"/><rect x="174" y="424" width="52" height="7" rx="4" class="ui"/>
    <rect x="174" y="359" width="30" height="5" rx="3" class="ui-soft"/><rect x="174" y="438" width="36" height="5" rx="3" class="ui-soft"/>
    <rect x="232" y="344" width="20" height="12" rx="6" class="purple"/><circle cx="246" cy="350" r="4" fill="#fff"/>
    <rect x="232" y="423" width="20" height="12" rx="6" class="ui-soft"/><circle cx="238" cy="429" r="4" fill="#fff"/>
    <rect x="183" y="522" width="34" height="4" rx="2" fill="#d3d8e1"/>
  </g>
  <text x="125" y="578" class="caption muted">MOBILE / 390 PT</text>

  <!-- website browser: standard wide 16:9-ish presentation frame -->
  <g filter="url(#shadow)">
    <rect x="360" y="247" width="460" height="260" rx="16" class="frame"/>
    <rect x="367" y="254" width="446" height="246" rx="11" fill="#fff"/>
    <circle cx="389" cy="272" r="5" fill="#ffb7aa"/><circle cx="406" cy="272" r="5" fill="#ffd889"/><circle cx="423" cy="272" r="5" fill="#9fdfc1"/>
    <rect x="367" y="286" width="446" height="42" fill="#eef0ff"/>
    <rect x="393" y="302" width="70" height="8" rx="4" class="ui"/><rect x="625" y="302" width="42" height="7" rx="4" class="ui-soft"/><rect x="682" y="302" width="42" height="7" rx="4" class="ui-soft"/><rect x="744" y="298" width="43" height="16" rx="8" class="purple"/>
    <rect x="401" y="356" width="140" height="9" rx="5" class="ui"/><rect x="401" y="377" width="98" height="7" rx="4" class="ui-soft"/><rect x="401" y="400" width="82" height="21" rx="11" class="purple"/>
    <rect x="567" y="349" width="214" height="120" rx="12" class="pale"/>
    <rect x="590" y="373" width="124" height="8" rx="4" class="ui"/><rect x="590" y="394" width="96" height="7" rx="4" class="ui-soft"/><rect x="590" y="420" width="150" height="8" rx="4" fill="#fff"/>
  </g>
  <text x="360" y="578" class="caption muted">WEBSITE / 1440 PX</text>

  <path d="M848 350 H885" fill="none" stroke="#716cff" stroke-width="3" stroke-linecap="round"/><circle cx="848" cy="350" r="6" class="purple"/>
  <g>
    <text x="920" y="304" class="eyebrow purple">WHAT STAYS</text>
    <text x="920" y="348" class="title navy">The interior.</text>
    <text x="920" y="385" class="body muted">App bar, content rows,</text>
    <text x="920" y="413" class="body muted">controls and states.</text>
    <line x1="920" y1="448" x2="1100" y2="448" class="line"/>
    <text x="920" y="483" class="body navy">Same tokens · new scale</text>
  </g>
  <text x="72" y="606" class="caption muted">LIGHT CHROME  /  PRODUCT UI  /  RESPONSIVE SCALE</text>
</svg>
