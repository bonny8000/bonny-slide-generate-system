<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Screen interiors across mobile and website frames</title>
  <desc id="desc">A mobile phone and a website browser frame use the same token-scaled interface vocabulary inside their different containers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f8ff"/><stop offset="1" stop-color="#eef0ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#172b4d" flood-opacity=".14"/></filter>
    <style>
      .navy{fill:#172b4d}.muted{fill:#71809a}.purple{fill:#716cff}.pale{fill:#e9eaff}.ui{fill:#7f8999}.ui-soft{fill:#d8ddea}.frame{fill:#d7dce5}.line{stroke:#d9ddec;stroke-width:2}.eyebrow{font:600 15px Arial,sans-serif;letter-spacing:.16em}.title{font:700 28px Arial,"Microsoft JhengHei",sans-serif}.body{font:500 18px Arial,"Microsoft JhengHei",sans-serif}.caption{font:600 14px Arial,sans-serif;letter-spacing:.11em}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="72" y="72" class="eyebrow purple">SCREEN INTERIOR</text>
  <text x="72" y="119" class="title navy">Same system. Different frame.</text>
  <text x="72" y="154" class="body muted">The interior adapts to mobile and web without losing its product rhythm.</text>

  <!-- mobile -->
  <g filter="url(#shadow)">
    <rect x="92" y="216" width="232" height="306" rx="34" class="frame"/>
    <rect x="99" y="223" width="218" height="292" rx="28" fill="#fff"/>
    <rect x="173" y="235" width="70" height="10" rx="5" fill="#b8bfcc"/>
    <rect x="104" y="266" width="208" height="44" fill="#eef0ff"/>
    <circle cx="127" cy="288" r="10" class="purple"/><rect x="146" y="282" width="58" height="9" rx="4" class="ui"/><rect x="238" y="282" width="48" height="9" rx="4" class="ui-soft"/>
    <rect x="119" y="332" width="61" height="8" rx="4" class="ui"/><rect x="190" y="332" width="48" height="8" rx="4" class="ui-soft"/><rect x="250" y="328" width="39" height="16" rx="8" class="purple"/>
    <g filter="url(#shadow)"><rect x="119" y="364" width="178" height="53" rx="12" fill="#fff"/><rect x="119" y="430" width="178" height="53" rx="12" fill="#fff"/></g>
    <circle cx="140" cy="390" r="13" class="pale"/><circle cx="140" cy="456" r="13" class="pale"/>
    <rect x="160" y="382" width="62" height="8" rx="4" class="ui"/><rect x="160" y="448" width="76" height="8" rx="4" class="ui"/>
    <rect x="160" y="397" width="45" height="6" rx="3" fill="#cfd4e4"/><rect x="160" y="463" width="56" height="6" rx="3" fill="#cfd4e4"/>
    <rect x="256" y="382" width="25" height="15" rx="8" class="purple"/><circle cx="275" cy="389" r="5" fill="#fff"/><rect x="256" y="448" width="25" height="15" rx="8" fill="#d8ddea"/><circle cx="263" cy="455" r="5" fill="#fff"/>
  </g>
  <text x="92" y="559" class="caption muted">MOBILE / 390 PT</text>

  <!-- website -->
  <g filter="url(#shadow)">
    <rect x="376" y="244" width="438" height="258" rx="16" class="frame"/>
    <rect x="382" y="250" width="426" height="246" rx="11" fill="#fff"/>
    <circle cx="403" cy="269" r="5" fill="#ffb7aa"/><circle cx="420" cy="269" r="5" fill="#ffd889"/><circle cx="437" cy="269" r="5" fill="#9fdfc1"/>
    <rect x="382" y="282" width="426" height="42" fill="#eef0ff"/>
    <rect x="410" y="298" width="70" height="9" rx="4" class="ui"/><rect x="617" y="298" width="44" height="8" rx="4" class="ui-soft"/><rect x="676" y="298" width="44" height="8" rx="4" class="ui-soft"/><rect x="738" y="294" width="43" height="16" rx="8" class="purple"/>
    <rect x="416" y="351" width="145" height="10" rx="5" class="ui"/><rect x="416" y="372" width="102" height="7" rx="4" class="ui-soft"/><rect x="416" y="395" width="84" height="22" rx="11" class="purple"/>
    <rect x="590" y="344" width="186" height="115" rx="12" class="pale"/>
    <rect x="610" y="367" width="118" height="9" rx="4" class="ui"/><rect x="610" y="388" width="94" height="7" rx="4" class="ui-soft"/><rect x="610" y="414" width="142" height="8" rx="4" fill="#fff"/>
  </g>
  <text x="376" y="559" class="caption muted">WEBSITE / 1440 PX</text>

  <!-- explanation -->
  <path d="M842 348 H880" fill="none" stroke="#716cff" stroke-width="3" stroke-linecap="round"/><circle cx="842" cy="348" r="6" class="purple"/>
  <g>
    <text x="916" y="302" class="eyebrow purple">WHAT STAYS</text>
    <text x="916" y="346" class="title navy">The interior.</text>
    <text x="916" y="383" class="body muted">App bar, content rows,</text>
    <text x="916" y="411" class="body muted">controls and states.</text>
    <line x1="916" y1="446" x2="1100" y2="446" class="line"/>
    <text x="916" y="481" class="body navy">Same tokens · new scale</text>
  </g>
  <text x="72" y="594" class="caption muted">DEVICE CHROME  /  PRODUCT UI  /  RESPONSIVE SCALE</text>
</svg>
