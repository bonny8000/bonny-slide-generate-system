<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Screen interior anatomy</title>
  <desc id="desc">A device frame contains a token-scaled product interface made of an app bar, tabs, list rows, toggles, and a bottom sheet.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b2a4a" flood-opacity=".12"/>
    </filter>
    <style>
      .ink{fill:#172b4d}.muted{fill:#6f7f99}.accent{fill:#6f6cff}.soft{fill:#eef0ff}.line{stroke:#d8deeb;stroke-width:2}.label{font:600 20px Arial,sans-serif;letter-spacing:.02em}.small{font:500 17px Arial,sans-serif}.cjk{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#fafbfe"/>
  <text x="64" y="72" class="label accent">SCREEN INTERIOR</text>
  <text x="64" y="112" class="label ink cjk">外框只是 chrome，真正要讀得懂的是裡面的畫面</text>
  <text x="64" y="146" class="small muted cjk">用系統 token 建立可辨識、可縮放、像產品本身的 UI 結構。</text>

  <g filter="url(#shadow)">
    <rect x="84" y="206" width="318" height="350" rx="38" fill="#172b4d"/>
    <rect x="101" y="223" width="284" height="316" rx="25" fill="#ffffff"/>
    <rect x="194" y="232" width="98" height="16" rx="8" fill="#172b4d"/>
    <rect x="101" y="265" width="284" height="49" fill="#eef0ff"/>
    <circle cx="130" cy="290" r="12" fill="#6f6cff"/>
    <rect x="153" y="282" width="88" height="12" rx="6" fill="#172b4d"/>
    <rect x="264" y="280" width="74" height="16" rx="8" fill="#d8deeb"/>
    <rect x="118" y="334" width="76" height="20" rx="10" fill="#6f6cff"/>
    <rect x="205" y="338" width="62" height="12" rx="6" fill="#d8deeb"/>
    <rect x="276" y="338" width="72" height="12" rx="6" fill="#d8deeb"/>
    <g class="line">
      <line x1="118" y1="385" x2="368" y2="385"/><line x1="118" y1="438" x2="368" y2="438"/><line x1="118" y1="491" x2="368" y2="491"/>
    </g>
    <g fill="#eef0ff"><circle cx="138" cy="410" r="17"/><circle cx="138" cy="463" r="17"/><circle cx="138" cy="516" r="17"/></g>
    <g class="ink"><rect x="169" y="402" width="94" height="10" rx="5"/><rect x="169" y="455" width="118" height="10" rx="5"/><rect x="169" y="508" width="78" height="10" rx="5"/></g>
    <g class="muted"><rect x="169" y="418" width="74" height="7" rx="3.5"/><rect x="169" y="471" width="86" height="7" rx="3.5"/><rect x="169" y="524" width="102" height="7" rx="3.5"/></g>
    <g><rect x="320" y="400" width="29" height="16" rx="8" fill="#6f6cff"/><circle cx="341" cy="408" r="6" fill="#fff"/><rect x="320" y="453" width="29" height="16" rx="8" fill="#d8deeb"/><circle cx="328" cy="461" r="6" fill="#fff"/><rect x="320" y="506" width="29" height="16" rx="8" fill="#6f6cff"/><circle cx="341" cy="514" r="6" fill="#fff"/></g>
  </g>

  <g class="line" fill="none" stroke="#6f6cff" stroke-width="3">
    <path d="M420 286 H520 V250 H650"/><path d="M420 365 H550 V350 H650"/><path d="M420 457 H530 V450 H650"/><path d="M420 515 H560 V550 H650"/>
  </g>
  <g class="accent"><circle cx="420" cy="286" r="6"/><circle cx="420" cy="365" r="6"/><circle cx="420" cy="457" r="6"/><circle cx="420" cy="515" r="6"/></g>

  <g>
    <rect x="650" y="208" width="454" height="346" rx="22" fill="#ffffff" stroke="#d8deeb" stroke-width="2"/>
    <text x="686" y="258" class="label ink">SCREEN INTERIOR = UI structure</text>
    <g><rect x="686" y="292" width="44" height="44" rx="12" class="soft"/><text x="750" y="310" class="label accent">01</text><text x="804" y="310" class="small ink cjk">App bar / 頂部導覽</text><text x="750" y="334" class="small muted cjk">讓讀者知道這是哪個畫面</text></g>
    <g><rect x="686" y="365" width="44" height="44" rx="12" class="soft"/><text x="750" y="383" class="label accent">02</text><text x="804" y="383" class="small ink cjk">List rows / 資訊列</text><text x="750" y="407" class="small muted cjk">用真實的介面節奏承載內容</text></g>
    <g><rect x="686" y="438" width="44" height="44" rx="12" class="soft"/><text x="750" y="456" class="label accent">03</text><text x="804" y="456" class="small ink cjk">Toggle · Popup · Sheet</text><text x="750" y="480" class="small muted cjk">依照產品語言呈現互動狀態</text></g>
  </g>
</svg>
