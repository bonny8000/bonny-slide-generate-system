<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 482" role="img" aria-labelledby="t d"><title id="t">How it works</title><desc id="d">You, planner, router, builder and gate, with the failure loop and the three compiled sources.</desc><rect width="1200" height="482" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" fill="#7077FB" font-weight="700" letter-spacing="2">HOW IT WORKS</text><text x="56" y="86" font-size="24" fill="#2B3040" font-weight="700">From an ask to a deck, in five moves</text><text x="56" y="110" font-size="13" fill="#7C7E92">Nothing between these boxes is a judgement call made on the day.</text><rect x="56.0" y="142" width="140" height="112" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><circle cx="126.0" cy="168" r="10" fill="#7C7E92"/><text x="126.0" y="172" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="126.0" y="202" font-size="15" fill="#2B3040" font-weight="700" text-anchor="middle">You</text><text x="126.0" y="224" font-size="11" fill="#7C7E92" text-anchor="middle">audience, source,</text><text x="126.0" y="240" font-size="11" fill="#7C7E92" text-anchor="middle">one theme</text><rect x="293.0" y="142" width="140" height="112" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><circle cx="363.0" cy="168" r="10" fill="#7C7E92"/><text x="363.0" y="172" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="363.0" y="202" font-size="15" fill="#2B3040" font-weight="700" text-anchor="middle">Planner</text><text x="363.0" y="224" font-size="11" fill="#7C7E92" text-anchor="middle">one claim and one</text><text x="363.0" y="240" font-size="11" fill="#7C7E92" text-anchor="middle">intention per page</text><rect x="530.0" y="142" width="140" height="112" rx="14" fill="#E7E8FC" stroke="#7077FB"/><circle cx="600.0" cy="168" r="10" fill="#7077FB"/><text x="600.0" y="172" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="600.0" y="202" font-size="15" fill="#2B3040" font-weight="700" text-anchor="middle">Router</text><text x="600.0" y="224" font-size="11" fill="#7C7E92" text-anchor="middle">looks that intention</text><text x="600.0" y="240" font-size="11" fill="#7C7E92" text-anchor="middle">up in the index</text><rect x="767.0" y="142" width="140" height="112" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><circle cx="837.0" cy="168" r="10" fill="#7C7E92"/><text x="837.0" y="172" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="837.0" y="202" font-size="15" fill="#2B3040" font-weight="700" text-anchor="middle">Builder</text><text x="837.0" y="224" font-size="11" fill="#7C7E92" text-anchor="middle">one stylesheet,</text><text x="837.0" y="240" font-size="11" fill="#7C7E92" text-anchor="middle">one theme</text><rect x="1004.0" y="142" width="140" height="112" rx="14" fill="#2B3040" stroke="#2B3040"/><circle cx="1074.0" cy="168" r="10" fill="#FFFFFF"/><text x="1074.0" y="172" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="1074.0" y="172" font-size="12" fill="#2B3040" font-weight="700" text-anchor="middle">5</text><text x="1074.0" y="202" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Gate</text><text x="1074.0" y="224" font-size="11" fill="#B7BCD0" text-anchor="middle">renders it and</text><text x="1074.0" y="240" font-size="11" fill="#B7BCD0" text-anchor="middle">measures the pixels</text><path d="M206.0 184H283.0" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M289.0 179L283.0 184L289.0 189" stroke="#DCE0EB" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="244.5" y="210" font-size="10.5" fill="#7C7E92" text-anchor="middle">the ask</text><path d="M443.0 184H520.0" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M526.0 179L520.0 184L526.0 189" stroke="#DCE0EB" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="481.5" y="210" font-size="10.5" fill="#7C7E92" text-anchor="middle">&#24847;&#22294; + &#24418;&#29376;</text><path d="M680.0 184H757.0" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M763.0 179L757.0 184L763.0 189" stroke="#DCE0EB" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="718.5" y="210" font-size="10.5" fill="#7C7E92" text-anchor="middle">layout +</text><text x="718.5" y="225" font-size="10.5" fill="#7C7E92" text-anchor="middle">components</text><path d="M917.0 184H994.0" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M1000.0 179L994.0 184L1000.0 189" stroke="#DCE0EB" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="955.5" y="210" font-size="10.5" fill="#7C7E92" text-anchor="middle">rendered</text><text x="955.5" y="225" font-size="10.5" fill="#7C7E92" text-anchor="middle">HTML</text><path d="M1074.0 260V296H837.0V268" stroke="#7077FB" stroke-width="2" fill="none" stroke-dasharray="5 4"/><path d="M831.0 276L837.0 268L843.0 276" stroke="#7077FB" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="955.5" y="287" font-size="11" fill="#7077FB" font-weight="700" text-anchor="middle">fails &#8594; fix and re-render</text><rect x="56" y="330" width="1088" height="112" rx="16" fill="#FFFFFF" stroke="#DCE0EB" stroke-dasharray="6 5"/><text x="78" y="358" font-size="13" fill="#2B3040" font-weight="700">Planner, Router and Builder read from these three &#8212; and nothing else</text><rect x="78" y="372" width="340" height="52" rx="12" fill="#F1F4F9" stroke="#DCE0EB"/><text x="96" y="396" font-size="13" fill="#2B3040" font-weight="700">specs/</text><text x="96" y="414" font-size="11" fill="#7C7E92">what every pattern is FOR</text><rect x="452" y="372" width="340" height="52" rx="12" fill="#F1F4F9" stroke="#DCE0EB"/><text x="470" y="396" font-size="13" fill="#2B3040" font-weight="700">router.json</text><text x="470" y="414" font-size="11" fill="#7C7E92">the compiled index &#183; 44 patterns</text><rect x="826" y="372" width="340" height="52" rx="12" fill="#F1F4F9" stroke="#DCE0EB"/><text x="844" y="396" font-size="13" fill="#2B3040" font-weight="700">base.css + one theme</text><text x="844" y="414" font-size="11" fill="#7C7E92">the only implementation</text><text x="56" y="468" font-size="12.5" fill="#7C7E92">Edit a generated file and the next check fails. That is the point.</text></g></svg>