<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Bonny Slide System intention pipeline</title>
  <desc id="desc">Source material is structured into one claim and intention per page, mapped to a visual form, then built and audited.</desc>
  <rect width="1200" height="340" rx="24" fill="#FBFBFE"/>
  <text x="60" y="64" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7077FB" letter-spacing="2">INTENTION PIPELINE</text>
  <text x="60" y="94" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#2B3040">Source material becomes a deliberate slide deck</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="14" fill="#7C7E92">The page's job is decided before components, colour, or decoration.</text>

  <rect x="60" y="148" width="240" height="120" rx="18" fill="#F1F4F9"/>
  <circle cx="96" cy="184" r="16" fill="#DCE0EB"/>
  <text x="96" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2B3040" text-anchor="middle">1</text>
  <text x="124" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B3040">Frame the source</text>
  <text x="84" y="220" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Audience, room, assets, theme</text>
  <text x="84" y="242" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Research, notes, data, screens</text>

  <path d="M312 208h34" stroke="#DCE0EB" stroke-width="2"/>
  <path d="M340 202l8 6-8 6" fill="none" stroke="#DCE0EB" stroke-width="2"/>

  <rect x="360" y="148" width="240" height="120" rx="18" fill="#F1F4F9"/>
  <circle cx="396" cy="184" r="16" fill="#DCE0EB"/>
  <text x="396" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2B3040" text-anchor="middle">2</text>
  <text x="424" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B3040">Plan the pages</text>
  <text x="384" y="220" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">One claim and one intention</text>
  <text x="384" y="242" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Narrative order and source links</text>

  <path d="M612 208h34" stroke="#DCE0EB" stroke-width="2"/>
  <path d="M640 202l8 6-8 6" fill="none" stroke="#DCE0EB" stroke-width="2"/>

  <rect x="660" y="148" width="240" height="120" rx="18" fill="#F1F4F9"/>
  <circle cx="696" cy="184" r="16" fill="#DCE0EB"/>
  <text x="696" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2B3040" text-anchor="middle">3</text>
  <text x="724" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2B3040">Select the form</text>
  <text x="684" y="220" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Intention first, shape second</text>
  <text x="684" y="242" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Native or generated route</text>

  <path d="M912 208h34" stroke="#7077FB" stroke-width="2"/>
  <path d="M940 202l8 6-8 6" fill="none" stroke="#7077FB" stroke-width="2"/>

  <rect x="960" y="148" width="180" height="120" rx="18" fill="#E7E8FC"/>
  <circle cx="996" cy="184" r="16" fill="#7077FB"/>
  <text x="996" y="190" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1024" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7077FB">Build &amp; audit</text>
  <text x="984" y="220" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Tokens, recipes, assets</text>
  <text x="984" y="242" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">Render, inspect, correct</text>

  <text x="60" y="306" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92">A slide is delivered only after its structure, illustration decision, implementation, and rendered result agree.</text>
</svg>
