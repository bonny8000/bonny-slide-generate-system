<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 336" role="img" aria-labelledby="t d"><title id="t">Source of truth</title><desc id="d">Three hand-written sources; everything else is compiled.</desc><rect width="1200" height="336" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">STRUCTURE</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">Hand-write one column. Compile the rest.</text><text x="56" y="116" font-size="11.5" font-weight="700" fill="#7077FB" letter-spacing="1">HAND-WRITTEN</text><text x="700" y="116" font-size="11.5" font-weight="700" fill="#7077FB" letter-spacing="1">GENERATED &#8212; NEVER EDITED BY HAND</text><rect x="56" y="130" width="360" height="46" rx="12" fill="#F1F4F9" stroke="#DCE0EB"/><text x="76" y="150" font-size="13.5" font-weight="700" fill="#2B3040">specs/</text><text x="76" y="168" font-size="11.5" fill="#7C7E92">what each pattern is FOR</text><rect x="56" y="186" width="360" height="46" rx="12" fill="#F1F4F9" stroke="#DCE0EB"/><text x="76" y="206" font-size="13.5" font-weight="700" fill="#2B3040">system/tokens.json</text><text x="76" y="224" font-size="11.5" fill="#7C7E92">canonical colour, type, spacing</text><rect x="56" y="242" width="360" height="46" rx="12" fill="#E7E8FC" stroke="#7077FB"/><text x="76" y="262" font-size="13.5" font-weight="700" fill="#2B3040">assets/base.css</text><text x="76" y="280" font-size="11.5" fill="#7C7E92">the ONLY implementation</text><rect x="452" y="148" width="210" height="84" rx="14" fill="#2B3040"/><text x="557" y="182" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">compile_system.py</text><text x="557" y="204" font-size="11.5" fill="#B7BCD0" text-anchor="middle">deterministic</text><path d="M416 190h30" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M440 184l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M662 190h32" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M688 184l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="700" y="130" width="444" height="46" rx="12" fill="#FBFBFE" stroke="#DCE0EB"/><text x="720" y="150" font-size="13.5" font-weight="700" fill="#2B3040">router.json &#183; generated-router.md</text><text x="720" y="168" font-size="11.5" fill="#7C7E92">the intention index</text><rect x="700" y="186" width="444" height="46" rx="12" fill="#FBFBFE" stroke="#DCE0EB"/><text x="720" y="206" font-size="13.5" font-weight="700" fill="#2B3040">class-manifest.json &#183; coverage.md</text><text x="720" y="224" font-size="11.5" fill="#7C7E92">which classes build each pattern</text><rect x="700" y="242" width="444" height="46" rx="12" fill="#FBFBFE" stroke="#DCE0EB"/><text x="720" y="262" font-size="13.5" font-weight="700" fill="#2B3040">tokens-light/dark.css &#183; base-bundle.css</text><text x="720" y="280" font-size="11.5" fill="#7C7E92">+ pptx/generated_tokens.py</text><text x="56" y="318" font-size="13" fill="#7C7E92">Edit a generated file and the next <tspan font-weight="700" fill="#2B3040">--check</tspan> fails. That is the point.</text></g></svg>