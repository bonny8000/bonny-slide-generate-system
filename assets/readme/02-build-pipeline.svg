<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 226" role="img" aria-labelledby="t d"><title id="t">The build pipeline</title><desc id="d">Five steps: frame, plan, route, build, gate.</desc><rect width="1200" height="226" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">BUILDING A DECK</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">Decide what the page must DO before what it looks like</text><rect x="56" y="110" width="196" height="76" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="76" y="144" font-size="16" font-weight="700" fill="#2B3040">Frame</text><text x="76" y="168" font-size="12" fill="#7C7E92">audience &#183; one theme</text><path d="M252 148h20" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M266 142l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="274" y="110" width="196" height="76" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="294" y="144" font-size="16" font-weight="700" fill="#2B3040">Plan</text><text x="294" y="168" font-size="12" fill="#7C7E92">one claim, one intention</text><path d="M470 148h20" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M484 142l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="492" y="110" width="196" height="76" rx="14" fill="#E7E8FC" stroke="#7077FB"/><text x="512" y="144" font-size="16" font-weight="700" fill="#2B3040">Route</text><text x="512" y="168" font-size="12" fill="#7C7E92">look the intention up</text><path d="M688 148h20" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M702 142l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="710" y="110" width="196" height="76" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="730" y="144" font-size="16" font-weight="700" fill="#2B3040">Build</text><text x="730" y="168" font-size="12" fill="#7C7E92">base.css + tokens</text><path d="M906 148h20" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M920 142l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="928" y="110" width="196" height="76" rx="14" fill="#2B3040" stroke="#2B3040"/><text x="948" y="144" font-size="16" font-weight="700" fill="#FFFFFF">Gate</text><text x="948" y="168" font-size="12" fill="#B7BCD0">render &#183; measure &#183; fix</text><text x="56" y="212" font-size="13" fill="#7C7E92">Naming the intention is what lets step 3 pick the right layout instead of a plausible-looking one.</text></g></svg>