<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 476" role="img" aria-labelledby="t d"><title id="t">Routing keys on two axes</title><desc id="d">The planner writes a normalised intention and shape line; measured on this library intent alone identifies 13 of 25 layouts and the shape triple identifies 24 of 25.</desc><rect width="1200" height="476" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">ROUTING &#183; TWO AXES</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">Shape decides the layout. Intention breaks the tie.</text><rect x="56" y="108" width="1088" height="106" rx="14" fill="#E7E8FC" stroke="#7077FB"/><text x="80" y="136" font-size="12.5" fill="#7C7E92">Before any lookup, the planner writes one normalised line &#8212; derived from the content actually in hand, never from the layout it hopes to use.</text><text x="80" y="170" font-size="14" font-weight="700" fill="#7077FB">&#24847;&#22294;:</text><text x="140" y="170" font-size="14" fill="#2B3040">let the room meet the real users and what stops them</text><text x="80" y="198" font-size="14" font-weight="700" fill="#7077FB">&#24418;&#29376;:</text><text x="140" y="198" font-size="14" fill="#2B3040">quote+illustration&#8195;/&#8195;grid&#8195;/&#8195;few</text><text x="640" y="170" font-size="12" fill="#7C7E92">&#8592; what this page must DO</text><text x="640" y="198" font-size="12" fill="#7C7E92">&#8592; material / arrangement / count</text><rect x="56" y="232" width="536" height="106" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="80" y="260" font-size="13" font-weight="700" fill="#2B3040">intent alone</text><text x="80" y="296" font-size="26" font-weight="700" fill="#7C7E92">13</text><text x="118" y="296" font-size="15" fill="#7C7E92">of 25 layouts</text><rect x="290" y="284" width="278" height="10" rx="5" fill="#DCE0EB"/><rect x="290" y="284" width="145" height="10" rx="5" fill="#7C7E92"/><text x="80" y="322" font-size="12" fill="#7C7E92">Pairs of layouts share a job and separate only on material.</text><rect x="608" y="232" width="536" height="106" rx="14" fill="#F1F4F9" stroke="#7077FB"/><text x="632" y="260" font-size="13" font-weight="700" fill="#2B3040">the shape triple alone</text><text x="632" y="296" font-size="26" font-weight="700" fill="#7077FB">24</text><text x="670" y="296" font-size="15" fill="#7C7E92">of 25 layouts</text><rect x="842" y="284" width="278" height="10" rx="5" fill="#DCE0EB"/><rect x="842" y="284" width="267" height="10" rx="5" fill="#7077FB"/><text x="632" y="322" font-size="12" fill="#7C7E92">So shape is looked up first, and intention settles the remainder.</text><rect x="56" y="356" width="536" height="82" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="80" y="382" font-size="13.5" font-weight="700" fill="#2B3040">idea-evidence</text><text x="80" y="404" font-size="12" fill="#7C7E92">back a claim with the evidence for it</text><text x="80" y="424" font-size="12" fill="#7077FB">material: chart</text><rect x="608" y="356" width="536" height="82" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="632" y="382" font-size="13.5" font-weight="700" fill="#2B3040">painpoint-evidence</text><text x="632" y="404" font-size="12" fill="#7C7E92">back a claim with the evidence for it</text><text x="632" y="424" font-size="12" fill="#7077FB">material: quote</text><text x="56" y="462" font-size="13" fill="#7C7E92">Same job, different material. On held-out requests, writing the line first took routing from <tspan font-weight="700" fill="#2B3040">4/10 to 8/10</tspan>.</text></g></svg>
