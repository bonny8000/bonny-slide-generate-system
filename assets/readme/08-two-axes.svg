<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 336" role="img" aria-labelledby="t d"><title id="t">Two questions choose the layout</title><desc id="d">What the page must do narrows the choice to about half; what the page actually holds narrows it to almost one.</desc><rect width="1200" height="336" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">CHOOSING A LAYOUT</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">Two questions, and the second one decides</text><rect x="56" y="110" width="536" height="150" rx="16" fill="#F1F4F9" stroke="#DCE0EB"/><text x="80" y="146" font-size="17" font-weight="700" fill="#2B3040">What must this page DO?</text><text x="80" y="172" font-size="13" fill="#7C7E92">The job it has to do to the room.</text><rect x="80" y="192" width="488" height="12" rx="6" fill="#DCE0EB"/><rect x="80" y="192" width="254" height="12" rx="6" fill="#7C7E92"/><text x="80" y="234" font-size="13.5" font-weight="700" fill="#7C7E92">Narrows it to about half the layouts</text><rect x="608" y="110" width="536" height="150" rx="16" fill="#E7E8FC" stroke="#7077FB"/><text x="632" y="146" font-size="17" font-weight="700" fill="#2B3040">What does it actually hold?</text><text x="632" y="172" font-size="13" fill="#7C7E92">A chart? A quote? A screen? How many?</text><rect x="632" y="192" width="488" height="12" rx="6" fill="#FFFFFF"/><rect x="632" y="192" width="469" height="12" rx="6" fill="#7077FB"/><text x="632" y="234" font-size="13.5" font-weight="700" fill="#7077FB">Narrows it to almost exactly one</text><text x="56" y="296" font-size="14" fill="#2B3040">So the <tspan font-weight="700">content decides</tspan> the layout, and the job settles whatever is left over.</text><text x="56" y="318" font-size="12.5" fill="#7C7E92">Two layouts can share a job &#8212; back a claim with evidence &#8212; and differ only in whether that evidence is a chart or a quote.</text></g></svg>
