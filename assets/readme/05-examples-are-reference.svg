<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 224" role="img" aria-labelledby="t d"><title id="t">Examples are reference</title><desc id="d">Examples carry the shipped stylesheet instead of their own copy.</desc><rect width="1200" height="224" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">EXAMPLES</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">Examples demonstrate patterns. They never define them.</text><rect x="56" y="110" width="300" height="70" rx="14" fill="#E7E8FC" stroke="#7077FB"/><text x="78" y="140" font-size="14" font-weight="700" fill="#2B3040">assets/base.css</text><text x="78" y="164" font-size="12" fill="#7C7E92">every component lives here</text><path d="M356 146h56" stroke="#7077FB" stroke-width="2" fill="none"/><path d="M406 140l6 6-6 6" stroke="#7077FB" stroke-width="2" fill="none"/><text x="384" y="132" font-size="11" font-weight="700" fill="#7077FB" text-anchor="middle">sync</text><rect x="418" y="110" width="726" height="70" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="440" y="140" font-size="14" font-weight="700" fill="#2B3040">172 example files</text><text x="440" y="164" font-size="12" fill="#7C7E92">each carries the SHIPPED stylesheet, plus a small block for what is specific to that slide</text><text x="56" y="206" font-size="13" fill="#7C7E92">They had drifted three versions behind &#8212; and the agent learns layout by imitating them.</text></g></svg>