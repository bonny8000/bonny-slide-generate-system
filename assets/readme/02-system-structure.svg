<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Bonny Slide System structure</title>
  <desc id="desc">Decision logic, design rules, implementation fragments, and generated outputs remain separate layers.</desc>
  <rect width="1200" height="430" rx="24" fill="#FBFBFE"/>
  <text x="60" y="64" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7077FB" letter-spacing="2">SYSTEM STRUCTURE</text>
  <text x="60" y="94" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#2B3040">Decision logic and implementation stay separate</text>
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="14" fill="#7C7E92">Intention chooses the form; recipes and hypertokens make that choice consistent.</text>

  <rect x="390" y="140" width="420" height="64" rx="18" fill="#E7E8FC"/>
  <text x="600" y="168" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7077FB" text-anchor="middle">Decision layer</text>
  <text x="600" y="190" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92" text-anchor="middle">slide plan · intention map · learned preferences</text>

  <path d="M600 216v18" stroke="#DCE0EB" stroke-width="2"/>
  <path d="M594 220l6-8 6 8" fill="none" stroke="#DCE0EB" stroke-width="2"/>

  <rect x="300" y="242" width="600" height="64" rx="18" fill="#F1F4F9"/>
  <text x="600" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2B3040" text-anchor="middle">Design layer</text>
  <text x="600" y="292" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92" text-anchor="middle">foundations · themes · components · layouts · audit</text>

  <path d="M600 318v18" stroke="#DCE0EB" stroke-width="2"/>
  <path d="M594 322l6-8 6 8" fill="none" stroke="#DCE0EB" stroke-width="2"/>

  <rect x="200" y="344" width="800" height="64" rx="18" fill="#FFFFFF" stroke="#DCE0EB" stroke-width="2"/>
  <text x="600" y="372" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2B3040" text-anchor="middle">Implementation and output layer</text>
  <text x="600" y="394" font-family="Arial, sans-serif" font-size="13" fill="#7C7E92" text-anchor="middle">tokens · hypertokens · recipes → CSS · HTML · PDF · PPTX bridge</text>

  <text x="60" y="394" font-family="Arial, sans-serif" font-size="12" fill="#7C7E92" transform="rotate(-90 60 394)">SOURCE OF TRUTH</text>
</svg>
