<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="t d"><title id="t">Two modes</title><desc id="d">Asking for a deck reads the router; training writes to it.</desc><rect width="1200" height="240" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">MODES</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">The skill does two different things</text><rect x="56" y="110" width="536" height="98" rx="16" fill="#2B3040"/><text x="84" y="144" font-size="16" font-weight="700" fill="#FFFFFF">&#8220;make me a deck&#8221;</text><text x="84" y="172" font-size="13" fill="#B7BCD0">Builds slides.</text><text x="84" y="194" font-size="13" fill="#B7BCD0">READS the router.</text><rect x="608" y="110" width="536" height="98" rx="16" fill="#E7E8FC" stroke="#7077FB"/><text x="636" y="144" font-size="16" font-weight="700" fill="#2B3040">&#8220;training / &#35347;&#32244;&#8221;</text><text x="636" y="172" font-size="13" fill="#7C7E92">Learns from reference slides.</text><text x="636" y="194" font-size="13" fill="#7C7E92">WRITES to the router.</text><text x="56" y="230" font-size="13" fill="#7C7E92">A training run changes <tspan font-weight="700" fill="#2B3040">specs/</tspan> and never produces a slide. If the request is ambiguous, ask which one.</text></g></svg>