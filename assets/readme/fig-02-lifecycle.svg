<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 714" role="img" aria-labelledby="t d"><title id="t">One slide's life</title><desc id="d">A sequence of messages between you, the planner, the router, the stylesheet and the gate.</desc><rect width="1200" height="714" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" fill="#7077FB" font-weight="700" letter-spacing="2">ONE SLIDE'S LIFE</text><text x="56" y="86" font-size="24" fill="#2B3040" font-weight="700">What actually gets passed around</text><text x="56" y="110" font-size="13" fill="#7C7E92">The same page from the ask to delivery &#8212; including the part where it fails.</text><rect x="264.5" y="292" width="441.5" height="116" rx="12" fill="#E7E8FC" stroke="#7077FB" stroke-dasharray="6 5"/><text x="282.5" y="314" font-size="11.5" fill="#7077FB" font-weight="700">the routing moment</text><rect x="56.0" y="134" width="170" height="54" rx="12" fill="#F1F4F9" stroke="#DCE0EB"/><text x="141.0" y="158" font-size="14" fill="#2B3040" font-weight="700" text-anchor="middle">You</text><text x="141.0" y="176" font-size="10.5" fill="#7C7E92" text-anchor="middle">the audience</text><path d="M141.0 202V682" stroke="#DCE0EB" stroke-width="1.5" fill="none" stroke-dasharray="4 5"/><rect x="285.5" y="134" width="170" height="54" rx="12" fill="#F1F4F9" stroke="#DCE0EB"/><text x="370.5" y="158" font-size="14" fill="#2B3040" font-weight="700" text-anchor="middle">Planner</text><text x="370.5" y="176" font-size="10.5" fill="#7C7E92" text-anchor="middle">names the job</text><path d="M370.5 202V682" stroke="#DCE0EB" stroke-width="1.5" fill="none" stroke-dasharray="4 5"/><rect x="515.0" y="134" width="170" height="54" rx="12" fill="#F1F4F9" stroke="#DCE0EB"/><text x="600.0" y="158" font-size="14" fill="#2B3040" font-weight="700" text-anchor="middle">Router</text><text x="600.0" y="176" font-size="10.5" fill="#7C7E92" text-anchor="middle">the compiled index</text><path d="M600.0 202V682" stroke="#DCE0EB" stroke-width="1.5" fill="none" stroke-dasharray="4 5"/><rect x="744.5" y="134" width="170" height="54" rx="12" fill="#F1F4F9" stroke="#DCE0EB"/><text x="829.5" y="158" font-size="14" fill="#2B3040" font-weight="700" text-anchor="middle">Stylesheet</text><text x="829.5" y="176" font-size="10.5" fill="#7C7E92" text-anchor="middle">base.css + one theme</text><path d="M829.5 202V682" stroke="#DCE0EB" stroke-width="1.5" fill="none" stroke-dasharray="4 5"/><rect x="974.0" y="134" width="170" height="54" rx="12" fill="#F1F4F9" stroke="#DCE0EB"/><text x="1059.0" y="158" font-size="14" fill="#2B3040" font-weight="700" text-anchor="middle">Gate</text><text x="1059.0" y="176" font-size="10.5" fill="#7C7E92" text-anchor="middle">renders and measures</text><path d="M1059.0 202V682" stroke="#DCE0EB" stroke-width="1.5" fill="none" stroke-dasharray="4 5"/><path d="M141.0 232H370.5" stroke="#7C7E92" stroke-width="1.8" fill="none"/><path d="M376.5 227L370.5 232L376.5 237" stroke="#7C7E92" stroke-width="1.8" fill="none" stroke-linejoin="round"/><text x="255.75" y="223" font-size="11.5" fill="#2B3040" text-anchor="middle">the source, the audience, one theme</text><rect x="270.5" y="258" width="200" height="28" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="370.5" y="276" font-size="11" fill="#2B3040" text-anchor="middle">names the claim and the intention</text><path d="M370.5 348H600.0" stroke="#7077FB" stroke-width="1.8" fill="none"/><path d="M606.0 343L600.0 348L606.0 353" stroke="#7077FB" stroke-width="1.8" fill="none" stroke-linejoin="round"/><text x="485.25" y="339" font-size="11.5" fill="#7077FB" text-anchor="middle">&#24847;&#22294; + &#24418;&#29376;</text><path d="M600.0 392H370.5" stroke="#7077FB" stroke-width="1.8" fill="none"/><path d="M364.5 387L370.5 392L364.5 397" stroke="#7077FB" stroke-width="1.8" fill="none" stroke-linejoin="round"/><text x="485.25" y="383" font-size="11.5" fill="#7077FB" text-anchor="middle">one layout + the components it needs</text><path d="M370.5 448H829.5" stroke="#7C7E92" stroke-width="1.8" fill="none"/><path d="M835.5 443L829.5 448L835.5 453" stroke="#7C7E92" stroke-width="1.8" fill="none" stroke-linejoin="round"/><text x="600.0" y="439" font-size="11.5" fill="#2B3040" text-anchor="middle">build it with these classes</text><path d="M829.5 492H1059.0" stroke="#7C7E92" stroke-width="1.8" fill="none"/><path d="M1065.0 487L1059.0 492L1065.0 497" stroke="#7C7E92" stroke-width="1.8" fill="none" stroke-linejoin="round"/><text x="944.25" y="483" font-size="11.5" fill="#2B3040" text-anchor="middle">the rendered page</text><rect x="954" y="518" width="190" height="28" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="1049.0" y="536" font-size="11" fill="#2B3040" text-anchor="middle">measures the actual pixels</text><path d="M1059.0 580H370.5" stroke="#7077FB" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/><path d="M364.5 575L370.5 580L364.5 585" stroke="#7077FB" stroke-width="1.8" fill="none" stroke-linejoin="round"/><text x="714.75" y="571" font-size="11.5" fill="#7077FB" text-anchor="middle">FAIL &#8212; page 4 is starved, 34% empty</text><path d="M370.5 624H1059.0" stroke="#7C7E92" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/><path d="M1065.0 619L1059.0 624L1065.0 629" stroke="#7C7E92" stroke-width="1.8" fill="none" stroke-linejoin="round"/><text x="714.75" y="615" font-size="11.5" fill="#2B3040" text-anchor="middle">header composed down against its content</text><path d="M1059.0 668H141.0" stroke="#2B3040" stroke-width="1.8" fill="none"/><path d="M135.0 663L141.0 668L135.0 673" stroke="#2B3040" stroke-width="1.8" fill="none" stroke-linejoin="round"/><text x="600.0" y="659" font-size="11.5" fill="#2B3040" text-anchor="middle">pass &#8212; deck delivered</text><text x="56" y="706" font-size="12.5" fill="#7C7E92">A page that cannot state its job never reaches the router &#8212; and the router is the only thing allowed to pick a layout.</text></g></svg>