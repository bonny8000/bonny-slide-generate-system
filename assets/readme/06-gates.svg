<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">Checks before delivery</title><desc id="d">A built deck is measured by machine, then looked at by a person, before it is delivered.</desc><rect width="1200" height="340" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">BEFORE DELIVERY</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">Measured by a machine, then looked at by a person</text><rect x="56" y="110" width="200" height="116" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="78" y="158" font-size="15" font-weight="700" fill="#2B3040">A built deck</text><text x="78" y="184" font-size="12" fill="#7C7E92">HTML, one theme,</text><text x="78" y="202" font-size="12" fill="#7C7E92">one accent</text><path d="M256 168h28" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M278 162l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="284" y="110" width="340" height="116" rx="14" fill="#2B3040"/><text x="306" y="146" font-size="15" font-weight="700" fill="#FFFFFF">Measured</text><text x="306" y="172" font-size="12.5" fill="#B7BCD0">Did it render at all?</text><text x="306" y="192" font-size="12.5" fill="#B7BCD0">Is the page balanced and readable?</text><text x="306" y="212" font-size="12.5" fill="#B7BCD0">Was every illustration decided?</text><path d="M624 168h28" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M646 162l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="652" y="110" width="340" height="116" rx="14" fill="#E7E8FC" stroke="#7077FB"/><text x="674" y="146" font-size="15" font-weight="700" fill="#2B3040">Looked at</text><text x="674" y="172" font-size="12.5" fill="#7C7E92">Is it actually any good?</text><text x="674" y="192" font-size="12.5" fill="#7C7E92">Does the weakest page still</text><text x="674" y="212" font-size="12.5" fill="#7C7E92">need fixing?</text><path d="M992 168h28" stroke="#DCE0EB" stroke-width="2" fill="none"/><path d="M1014 162l6 6-6 6" stroke="#DCE0EB" stroke-width="2" fill="none"/><rect x="1020" y="110" width="124" height="116" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="1042" y="168" font-size="15" font-weight="700" fill="#2B3040">Delivered</text><rect x="56" y="246" width="1088" height="58" rx="14" fill="#E7E8FC" stroke="#7077FB" stroke-dasharray="5 4"/><text x="78" y="273" font-size="13.5" font-weight="700" fill="#2B3040">A pass is a floor, not a verdict.</text><text x="78" y="293" font-size="12" fill="#7C7E92">Three times a change passed every measurement and still looked worse. The machine can say a page is broken; only a person can say it is good.</text></g></svg>
