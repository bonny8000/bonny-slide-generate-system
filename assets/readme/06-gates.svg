<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 424" role="img" aria-labelledby="t d"><title id="t">The gates</title><desc id="d">Blocking checks on the deck and on the system, and the judgement no command can make.</desc><rect width="1200" height="424" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">ENFORCEMENT</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">Rules that are only prose degrade first</text><text x="56" y="118" font-size="11" font-weight="700" fill="#7C7E92" letter-spacing="1.5">ON THE DECK YOU ARE BUILDING</text><rect x="56" y="130" width="352" height="76" rx="14" fill="#2B3040"/><text x="78" y="160" font-size="13.5" font-weight="700" fill="#FFFFFF">validate_layout.py</text><text x="78" y="182" font-size="11.5" fill="#B7BCD0">balance &#183; density &#183; language &#183; pacing</text><rect x="424" y="130" width="352" height="76" rx="14" fill="#2B3040"/><text x="446" y="160" font-size="13.5" font-weight="700" fill="#FFFFFF">validate_editorial_explainer_plan.py</text><text x="446" y="182" font-size="11.5" fill="#B7BCD0">every page decided &#183; provenance real</text><rect x="792" y="130" width="352" height="76" rx="14" fill="#E7E8FC" stroke="#7077FB"/><text x="814" y="160" font-size="13.5" font-weight="700" fill="#2B3040">audit.md &#183; and look at the render</text><text x="814" y="182" font-size="11.5" fill="#7C7E92">the part no command can do for you</text><text x="56" y="232" font-size="11" font-weight="700" fill="#7C7E92" letter-spacing="1.5">ON THE SYSTEM, WHENEVER IT CHANGES</text><rect x="56" y="244" width="352" height="76" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="78" y="274" font-size="13.5" font-weight="700" fill="#2B3040">compile_system.py --check</text><text x="78" y="296" font-size="11.5" fill="#7C7E92">token &amp; routing drift &#183; unreachable pattern</text><rect x="424" y="244" width="352" height="76" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="446" y="274" font-size="13.5" font-weight="700" fill="#2B3040">sync_examples.py --check</text><text x="446" y="296" font-size="11.5" fill="#7C7E92">an example carrying a stale stylesheet</text><rect x="792" y="244" width="352" height="76" rx="14" fill="#F1F4F9" stroke="#DCE0EB"/><text x="814" y="274" font-size="13.5" font-weight="700" fill="#2B3040">routing &#183; rebuild &#183; baseline &#183; antipatterns</text><text x="814" y="296" font-size="11.5" fill="#7C7E92">still resolves, rebuilds, renders the same</text><rect x="56" y="340" width="1088" height="56" rx="14" fill="#E7E8FC" stroke="#7077FB" stroke-dasharray="5 4"/><text x="78" y="366" font-size="13.5" font-weight="700" fill="#2B3040">A pass is a floor, not a verdict.</text><text x="78" y="386" font-size="12" fill="#7C7E92">Three times a change has cleared every gate and looked worse &#8212; most recently a card layout that went FAIL to pass at 34% whitespace by flinging its own content to the card&#8217;s edges.</text></g></svg>
