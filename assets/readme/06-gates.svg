<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 262" role="img" aria-labelledby="t d"><title id="t">The gates</title><desc id="d">Four blocking checks, and what they cannot tell you.</desc><rect width="1200" height="262" rx="20" fill="#FBFBFE"/><g font-family="Arial, sans-serif"><text x="56" y="52" font-size="13" font-weight="700" fill="#7077FB" letter-spacing="2">ENFORCEMENT</text><text x="56" y="86" font-size="24" font-weight="700" fill="#2B3040">Rules that are only prose degrade first</text><rect x="56" y="110" width="262" height="70" rx="14" fill="#2B3040"/><text x="76" y="140" font-size="13.5" font-weight="700" fill="#FFFFFF">compile --check</text><text x="76" y="162" font-size="11.5" fill="#B7BCD0">routing &amp; token drift</text><rect x="330" y="110" width="262" height="70" rx="14" fill="#2B3040"/><text x="350" y="140" font-size="13.5" font-weight="700" fill="#FFFFFF">sync_examples --check</text><text x="350" y="162" font-size="11.5" fill="#B7BCD0">an example gone stale</text><rect x="604" y="110" width="262" height="70" rx="14" fill="#2B3040"/><text x="624" y="140" font-size="13.5" font-weight="700" fill="#FFFFFF">validate_layout</text><text x="624" y="162" font-size="11.5" fill="#B7BCD0">balance &#183; density &#183; language</text><rect x="878" y="110" width="262" height="70" rx="14" fill="#2B3040"/><text x="898" y="140" font-size="13.5" font-weight="700" fill="#FFFFFF">illustration plan</text><text x="898" y="162" font-size="11.5" fill="#B7BCD0">every page decided</text><rect x="56" y="196" width="1088" height="48" rx="14" fill="#E7E8FC" stroke="#7077FB" stroke-dasharray="5 4"/><text x="78" y="218" font-size="13.5" font-weight="700" fill="#2B3040">A pass is a floor, not a verdict.</text><text x="78" y="236" font-size="12" fill="#7C7E92">Twice in v12.9 a change passed every gate and looked worse &#8212; only the screenshot caught it. Always look at the render.</text></g></svg>