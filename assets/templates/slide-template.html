<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bonny Slide Template</title>
    <link rel="stylesheet" href="../bonny-slide-tokens.css">
  </head>
  <body>
    <main class="slide" data-mode="light" aria-label="Bonny slide">
      <section class="slide-frame">
        <p class="eyebrow latin">Desk Research</p>
        <h1 class="headline cjk">
          使用者資料顯示，核心痛點集中在
          <span class="accent-blue">資訊判讀成本</span>
        </h1>
        <p class="subtitle cjk">
          將研究證據整理成三個可比較的卡片，最後用一個清楚的 insight band 收斂判斷。
        </p>

        <div class="content-grid grid-3" style="margin-block-start: 78px;">
          <article class="card" style="padding: 34px;">
            <span class="pill latin">01</span>
            <h2 class="cjk" style="font-size: 30px; margin: 28px 0 14px;">資料分散</h2>
            <p class="cjk muted" style="font-size: 22px; margin: 0;">
              使用者需要在多個來源之間切換，造成判斷時間增加。
            </p>
          </article>

          <article class="card" style="padding: 34px;">
            <span class="pill latin">02</span>
            <h2 class="cjk" style="font-size: 30px; margin: 28px 0 14px;">流程中斷</h2>
            <p class="cjk muted" style="font-size: 22px; margin: 0;">
              關鍵資訊沒有在決策當下出現，導致使用者反覆確認。
            </p>
          </article>

          <article class="card" style="padding: 34px;">
            <span class="pill latin">03</span>
            <h2 class="cjk" style="font-size: 30px; margin: 28px 0 14px;">信任不足</h2>
            <p class="cjk muted" style="font-size: 22px; margin: 0;">
              缺少明確狀態與來源說明時，使用者不容易完成下一步。
            </p>
          </article>
        </div>

        <div class="key-band cjk" style="margin-block-start: 48px;">
          Key Insight：需要把分散資訊轉換成可立即判斷的服務提示。
        </div>
      </section>
    </main>
  </body>
</html>
