<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px; background:#fff; font-family:var(--font-latin); }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .swatch { width:128px; }
  .chip { height:96px; border-radius:10px; border:1px solid rgba(0,0,0,.06); display:flex; align-items:flex-end; padding:10px; color:#fff; font-size:11px; font-weight:600;}
  .light-chip { color:#111827; background:#fff; }
  .label { margin-top:8px; font-size:12px; color:var(--fg2); }
  .hex { font-size:11px; color:var(--fg4); font-family:"JetBrains Mono", ui-monospace, monospace; }
  .group-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--fg4); margin:0 0 12px; }
</style>
</head>
<body>
  <p class="group-title">Light canvas neutrals — surfaces & text</p>
  <div class="row">
    <div class="swatch"><div class="chip light-chip" style="background:#ffffff">surface</div><div class="label">bg1 surface</div><div class="hex">#FFFFFF</div></div>
    <div class="swatch"><div class="chip light-chip" style="background:#f6f8fb">canvas</div><div class="label">bg2 canvas</div><div class="hex">#F6F8FB</div></div>
    <div class="swatch"><div class="chip light-chip" style="background:#f2f5f9">alt canvas</div><div class="label">bg3 alt</div><div class="hex">#F2F5F9</div></div>
    <div class="swatch"><div class="chip" style="background:#111827">fg1 primary</div><div class="label">fg1 primary</div><div class="hex">#111827</div></div>
    <div class="swatch"><div class="chip" style="background:#344054">fg2 body</div><div class="label">fg2 body</div><div class="hex">#344054</div></div>
    <div class="swatch"><div class="chip" style="background:#667085">fg3 muted</div><div class="label">fg3 muted</div><div class="hex">#667085</div></div>
    <div class="swatch"><div class="chip" style="background:#98a2b3">fg4 quiet</div><div class="label">fg4 quiet</div><div class="hex">#98A2B3</div></div>
  </div>
</body>
</html>
