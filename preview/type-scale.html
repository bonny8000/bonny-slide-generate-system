<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:28px; background:#fff; font-family:var(--font-latin); }
  .group-title { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--fg4); margin:0 0 16px; }
  .row { display:grid; grid-template-columns:auto 1fr; gap:10px 20px; align-items:baseline; }
  .meta { color:var(--fg4); font-size:11px; font-family:Arial, sans-serif; white-space:nowrap; }
  .specimen.cover    { font-size:64px; font-weight:500; line-height:1.1; }
  .specimen.h1       { font-size:44px; font-weight:600; line-height:1.15; }
  .specimen.h2       { font-size:32px; font-weight:600; }
  .specimen.h3       { font-size:24px; font-weight:600; }
  .specimen.body     { font-size:18px; font-weight:400; color:var(--fg2); }
  .specimen.caption  { font-size:13px; color:var(--fg4); }
  /* Symbol-smaller convention: %, +, $, etc render at 0.65 of the surrounding size */
  .sym { font-size:0.65em; font-weight:500; }
</style>
</head>
<body>
  <p class="group-title">Display & body — CJK (台北黑體 / Taipei Sans TC, ls 0.05em) + Latin (Arial, ls 0)</p>
  <div class="row">
    <span class="meta">64/500</span><div class="specimen cover cjk">封面標題 <span class="latin accent-blue">Cover</span></div>
    <span class="meta">44/600</span><div class="specimen h1 cjk">投影片主標題 — 一個明確論點</div>
    <span class="meta">32/600</span><div class="specimen h2 cjk">次級標題 / Card title</div>
    <span class="meta">24/600</span><div class="specimen h3 cjk">卡片標題 Card title</div>
    <span class="meta">18/400</span><div class="specimen body cjk">內文段落 — 保持兩行以內，敘述補充頭條的論點。</div>
    <span class="meta">13/400</span><div class="specimen caption latin">Caption · Source · Method · N=320 · 2024 Q3</div>
  </div>
</body>
</html>
