<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px; background:#f6f8fb; font-family:Arial, sans-serif; }
  .group-title { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#667085; margin:0 0 16px; }

  .stack { display:flex; flex-direction:column; gap:10px; }

  /* Each feature row is a horizontal layout: icon | text-stack
     The icon and text-stack are both flex children — icon is fixed width,
     text-stack flexes. Both align to the top so the title sits across from icon. */
  .row {
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 18px;
    border:1px solid #e3e8f0;
    border-radius:12px;
    background:#fff;
  }
  .row.highlight { border-color:#7fa3d9; border-left:3px solid #2854ff; }

  .icon {
    width:42px;
    height:42px;
    border-radius:10px;
    background:#eaf2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }

  .body { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
  .title {
    font-family:"Taipei Sans TC Beta", "Microsoft JhengHei", sans-serif;
    font-size:15px;
    font-weight:500;
    color:#2d3748;        /* dark grey, not pure black */
    letter-spacing:0.05em;
    margin:0;
  }
  .value {
    font-family:"Taipei Sans TC Beta", "Microsoft JhengHei", sans-serif;
    font-size:12px;
    font-weight:400;
    color:#667085;
    letter-spacing:0.05em;
    margin:0;
    line-height:1.45;
  }
</style>
</head>
<body>
  <p class="group-title">Feature stack · MVP / pillars · icon left, title above value</p>
  <div class="stack">
    <div class="row highlight">
      <div class="icon">⚡</div>
      <div class="body">
        <h3 class="title">一鍵下單，省去重複輸入</h3>
        <p class="value">把六步驟壓到三步 — 平均完成時間下降 50%。</p>
      </div>
    </div>
    <div class="row">
      <div class="icon">🔍</div>
      <div class="body">
        <h3 class="title">智慧搜尋與推薦理由</h3>
        <p class="value">每張卡片附上「為何推薦」一行，提升信任度。</p>
      </div>
    </div>
    <div class="row">
      <div class="icon">📊</div>
      <div class="body">
        <h3 class="title">即時狀態追蹤</h3>
        <p class="value">送出後可隨時查看處理進度，避免重複詢問。</p>
      </div>
    </div>
  </div>
</body>
</html>
