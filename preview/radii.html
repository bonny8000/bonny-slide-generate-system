<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:28px; background:#fff; font-family:var(--font-latin); }
  .group-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--fg4); margin:0 0 16px; }
  .row { display:flex; gap:18px; flex-wrap:wrap; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:90px; height:90px; background:#eaf2ff; border:1px solid #2f80ed; }
  .label { font-size:11px; color:var(--fg3); font-family:"JetBrains Mono", ui-monospace, monospace; text-align:center; }
  .px { font-size:10px; color:var(--fg4); }
</style>
</head>
<body>
  <p class="group-title">Border-radii · cards / dense / report / pill</p>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="label">--r-card</div><div class="px">24 px</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="label">--r-dense</div><div class="px">16 px</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="label">--r-report</div><div class="px">12 px</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="label">--r-pill</div><div class="px">999 px</div></div>
  </div>
</body>
</html>
