<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:28px; background:#fff; font-family:var(--font-latin); }
  .group-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--fg4); margin:0 0 16px; }
  .scale { display:flex; flex-direction:column; gap:10px; }
  .row { display:grid; grid-template-columns:60px 1fr auto; align-items:center; gap:18px; }
  .tok { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:12px; color:var(--fg3); }
  .bar { background:#2f80ed; border-radius:4px; height:14px; }
  .px { font-size:12px; color:var(--fg4); font-family:"JetBrains Mono", ui-monospace, monospace; }
</style>
</head>
<body>
  <p class="group-title">Spacing scale · 8-based · use the named tokens</p>
  <div class="scale">
    <div class="row"><span class="tok">--sp-1</span><div class="bar" style="width:8px"></div><span class="px">8 px</span></div>
    <div class="row"><span class="tok">--sp-2</span><div class="bar" style="width:12px"></div><span class="px">12 px</span></div>
    <div class="row"><span class="tok">--sp-3</span><div class="bar" style="width:16px"></div><span class="px">16 px</span></div>
    <div class="row"><span class="tok">--sp-4</span><div class="bar" style="width:20px"></div><span class="px">20 px</span></div>
    <div class="row"><span class="tok">--sp-5</span><div class="bar" style="width:24px"></div><span class="px">24 px</span></div>
    <div class="row"><span class="tok">--sp-6</span><div class="bar" style="width:32px"></div><span class="px">32 px</span></div>
    <div class="row"><span class="tok">--sp-7</span><div class="bar" style="width:40px"></div><span class="px">40 px</span></div>
    <div class="row"><span class="tok">--sp-8</span><div class="bar" style="width:48px"></div><span class="px">48 px</span></div>
    <div class="row"><span class="tok">--sp-9</span><div class="bar" style="width:64px"></div><span class="px">64 px</span></div>
    <div class="row"><span class="tok">--sp-10</span><div class="bar" style="width:80px"></div><span class="px">80 px</span></div>
  </div>
</body>
</html>
