<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px; background:#f6f8fb; font-family:Arial, sans-serif; }
  .group-title { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#667085; margin:0 0 16px; }

  /* Three-column layout: as-is (muted) → arrow → to-be (prominent, accent green) */
  .comparison {
    display:grid;
    grid-template-columns: 1fr 60px 1.05fr;
    gap:0;
    align-items:stretch;
  }
  .col { display:flex; flex-direction:column; }

  .header {
    padding:10px 16px;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    border-radius:12px 12px 0 0;
  }
  .col.as-is .header { background:#eceff3; color:#8a93a3; }
  .col.to-be .header { background:#cdebd9; color:#1f7050; }

  .body {
    flex:1;
    padding:14px 16px;
    border:1px solid;
    border-top:0;
    border-radius:0 0 12px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    background:#fff;
  }
  .col.as-is .body { border-color:#e3e8f0; opacity:0.85; }
  .col.to-be .body { border-color:#9ed6b9; box-shadow: 0 12px 28px rgba(46,140,90,.10); }

  .row {
    display:flex;
    align-items:flex-start;
    gap:8px;
    font-size:12px;
    line-height:1.5;       /* 150% — same for CJK and Latin */
  }
  .col.as-is .row { color:#7a8493; }
  .col.to-be .row { color:#111827; font-weight:500; }
  /* CJK gets 5% tracking, Latin stays at 0% — same rule the rest of the system uses. */
  .row .cjk { letter-spacing: 0.05em; }
  .row .latin { letter-spacing: 0; }

  .icon {
    width:14px;
    height:14px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, sans-serif;
    font-size:10px;
    font-weight:700;
    margin-top:2px;
    line-height:1;
  }
  .col.as-is .icon { background:#e3e8f0; color:#98a2b3; }
  .col.to-be .icon { background:#2da06d; color:#fff; }

  .arrow {
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    color:#9aa5b6;
  }
</style>
</head>
<body>
  <p class="group-title">As-Is / To-Be comparison · muted current state → prominent future state</p>
  <div class="comparison">
    <div class="col as-is">
      <div class="header">AS-IS · 現況</div>
      <div class="body">
        <div class="row"><span class="icon">×</span><span class="cjk">每次查詢都打 DB，回應慢</span></div>
        <div class="row"><span class="icon">×</span><span class="cjk">熱門商品被重複查詢</span></div>
        <div class="row"><span class="icon">×</span><span class="cjk">流量大時系統易卡頓</span></div>
      </div>
    </div>
    <div class="arrow">→</div>
    <div class="col to-be">
      <div class="header">TO-BE · 改版後</div>
      <div class="body">
        <div class="row"><span class="icon">✓</span><span class="cjk">先查快取，命中即回 — <span class="latin">10×</span> 更快</span></div>
        <div class="row"><span class="icon">✓</span><span class="cjk">熱門商品自動快取</span></div>
        <div class="row"><span class="icon">✓</span><span class="cjk">DB 壓力顯著下降</span></div>
      </div>
    </div>
  </div>
</body>
</html>
