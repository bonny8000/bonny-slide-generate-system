<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/bonny-slide-v2-tokens.css" />
<style>
  body { display:block; margin:0; padding:28px; background:#f6f8fb; }
  .group-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#667085; margin:0 0 18px; font-family:Inter,sans-serif; }
  .demo { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  .demo .card-pad { padding:18px 20px; border-radius:18px; }
  .demo .card-title { font-size:15px; margin:0 0 6px; }
  .demo .card-body { font-size:12px; line-height:1.5; }
  .demo .pill { font-size:10px; padding:3px 10px; margin-bottom:8px; }
  .demo .source { font-size:9px; margin-top:8px; display:block; }
</style>
</head>
<body>
  <p class="group-title">Evidence card · 3-column default · for desk research / survey findings</p>
  <div class="demo">
    <article class="card card-pad">
      <p class="pill latin">01</p>
      <h2 class="card-title cjk">日均熱車量持續上升</h2>
      <p class="card-body cjk">2025 年達 24 萬 6 千人，較去年 +12%。</p>
      <p class="source latin">Source: KTX Report 2025</p>
    </article>
    <article class="card card-pad">
      <p class="pill latin">02</p>
      <h2 class="card-title cjk">線上預訂為主流通路</h2>
      <p class="card-body cjk">88.2% 的乘客使用線上管道購票。</p>
      <p class="source latin">Source: Annual Survey 2024</p>
    </article>
    <article class="card card-pad card-accent card-accent-blue">
      <p class="pill latin">KEY</p>
      <h2 class="card-title cjk">App 累計下載量第一</h2>
      <p class="card-body cjk">1,600 萬下載 — 公共服務 App 排名第一。</p>
      <p class="source latin">Source: MOI Brief, 2024</p>
    </article>
  </div>
</body>
</html>
