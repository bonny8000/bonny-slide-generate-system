<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../assets/bonny-slide-v2-tokens.css" />
<style>
  body { display:block; margin:0; padding:28px; background:#f6f8fb; }
  .group-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#667085; margin:0 0 18px; font-family:Inter,sans-serif; }
  .demo { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  .pain-card { padding:16px 20px; gap:10px; border-radius:18px; }
  .pain-label { font-size:9px; }
  .pain-title { font-size:14px; }
  .pain-quote { font-size:12px; padding-inline-start:12px; }
  .pain-root { font-size:11px; }
  .severity { font-size:9px; padding:3px 10px; }
</style>
</head>
<body>
  <p class="group-title">Pain card triad · friction with cause · pink/red accent only when actual pain</p>
  <div class="demo">
    <article class="pain-card">
      <span class="pain-label latin">PAIN 01</span>
      <h3 class="pain-title cjk">難以信任的捐款機構</h3>
      <p class="pain-quote cjk">「不知道我的捐款怎麼用，所以連知名機構都很難信任。」</p>
      <p class="pain-root cjk">透明度不足 · 結果回饋缺失</p>
    </article>
    <article class="pain-card">
      <span class="pain-label latin">PAIN 02</span>
      <h3 class="pain-title cjk">購買流程困難</h3>
      <p class="pain-quote cjk">「要先換 ETH 才能買，價格波動讓我猶豫。」</p>
      <p class="pain-root cjk">加密貨幣門檻 · gas fee 不確定</p>
    </article>
    <article class="pain-card">
      <span class="pain-label latin">PAIN 03</span>
      <h3 class="pain-title cjk">負面印象仍存</h3>
      <p class="pain-quote cjk">「社群可便宜入手，但不熟的人很吃虧。」</p>
      <p class="pain-root cjk">資訊不對稱 · 公平性疑慮</p>
    </article>
  </div>
</body>
</html>
