<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px; background:#f6f8fb; font-family:Arial, sans-serif; }
  .group-title { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#667085; margin:0 0 18px; }

  /* Timeline: equal-width segments butted edge-to-edge (gap:0). Number sits ABOVE the
     text inside each card. A connector line runs through the row of number badges. */
  .timeline {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #e3e8f0;
    background: #fff;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 16px 20px;
    text-align: center;
    border-right: 1px solid #e3e8f0;   /* divider between cards, not a gap */
    background: #fff;
  }
  .stage:last-child { border-right: 0; }

  .stage-num {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #2854ff;
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;        /* number above text */
  }
  .stage-title {
    font-size: 13px;
    font-weight: 600;
    color: #111827;
    margin: 0 0 4px;
    letter-spacing: 0.05em;
  }
  .stage-body {
    font-size: 11px;
    color: #667085;
    line-height: 1.45;
    letter-spacing: 0.05em;
    margin: 0;
  }
</style>
</head>
<body>
  <p class="group-title">Workflow timeline · equal-width segments · number above text · 3–5 stages</p>
  <div class="timeline">
    <div class="stage">
      <div class="stage-num">1</div>
      <h3 class="stage-title">發現需求</h3>
      <p class="stage-body">使用者察覺問題</p>
    </div>
    <div class="stage">
      <div class="stage-num">2</div>
      <h3 class="stage-title">蒐集資訊</h3>
      <p class="stage-body">瀏覽、比較、儲存</p>
    </div>
    <div class="stage">
      <div class="stage-num">3</div>
      <h3 class="stage-title">下單申請</h3>
      <p class="stage-body">完成核心轉換</p>
    </div>
    <div class="stage">
      <div class="stage-num">4</div>
      <h3 class="stage-title">追蹤回饋</h3>
      <p class="stage-body">查看進度、收件</p>
    </div>
  </div>
</body>
</html>
