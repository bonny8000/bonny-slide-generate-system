<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--font-latin); }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .swatch { width:128px; }
  .chip { height:84px; border-radius:10px; border:1px solid rgba(0,0,0,.08); }
  .label { margin-top:8px; font-size:12px; color:var(--fg2); }
  .hex { font-size:11px; color:var(--fg4); font-family:"JetBrains Mono", ui-monospace, monospace; }
  .group-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--fg4); margin:0 0 12px; }
</style>
</head>
<body>
  <p class="group-title">Soft accent surfaces — for card backgrounds & callouts</p>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#eaf2ff"></div><div class="label">Blue soft</div><div class="hex">#EAF2FF</div></div>
    <div class="swatch"><div class="chip" style="background:#e7f8ef"></div><div class="label">Green soft</div><div class="hex">#E7F8EF</div></div>
    <div class="swatch"><div class="chip" style="background:#f0efff"></div><div class="label">Purple soft</div><div class="hex">#F0EFFF</div></div>
    <div class="swatch"><div class="chip" style="background:#fff5da"></div><div class="label">Warm soft</div><div class="hex">#FFF5DA</div></div>
    <div class="swatch"><div class="chip" style="background:#ffe8ef"></div><div class="label">Pain soft</div><div class="hex">#FFE8EF</div></div>
    <div class="swatch"><div class="chip" style="background:#f2f4f7"></div><div class="label">Gray soft</div><div class="hex">#F2F4F7</div></div>
  </div>
</body>
</html>
