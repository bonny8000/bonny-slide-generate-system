/* ============================================================
   Bonny Slide System v6 · base.css  (SHARED, mode-independent)
   Spacing scale · 12-col grid · full component library · tone modifiers.
   Color lives ONLY in tokens-light.css / tokens-dark.css.
   ============================================================ */

*{box-sizing:border-box}
html,body{margin:0;background:var(--backdrop)}
body{display:grid;place-items:center;font-family:var(--font-latin)}

/* ===== Canvas ===== */
.slide{
  background:var(--canvas);color:var(--ink);position:relative;line-height:var(--lh);
  padding:var(--pad-y);            /* EQUAL four-side margin — uniform content safe-area (top=bottom=left=right) */
  display:flex;flex-direction:column;justify-content:center;gap:var(--gap-section);
}
.slide.deck{width:1920px;height:1080px}
.slide.poster{width:1080px;height:auto;justify-content:flex-start;gap:var(--s7)}
/* header-led slides pin the title near the top; pair with a growing body so content
   fills the full height (empty top AND empty bottom both read unfinished) */
.slide.top{justify-content:flex-start}
.grow{flex:1;min-height:0}            /* body region fills remaining height; footer sits at the bottom */
.vspread{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between}  /* fill AND distribute children top→bottom, so a short block doesn't float (centered) inside the body */

/* ===== 12-column grid (canonical splits: 6+6 · 7+5 · 8+4 · 4+4+4) ===== */
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gutter);align-items:start}
.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-6{grid-column:span 6}
.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-12{grid-column:span 12}
.cards{display:var(--recipe-layout-grid-display);gap:var(--gutter)}
.cards.two{grid-template-columns:1fr 1fr}
.cards.three{grid-template-columns:repeat(3,1fr)}

/* ===== Type ===== */
.cjk{font-family:var(--font-cjk);letter-spacing:var(--ls-cjk)}
.latin{font-family:var(--font-latin);letter-spacing:var(--ls-latin)}
.eyebrow{font-size:var(--fs-eyebrow);font-weight:600;color:var(--muted);margin:0}
.headline .accent{color:var(--accent)}
.sub.en{font-size:15px;color:var(--muted)}
.meta{font-size:var(--fs-caption);color:var(--muted);margin:0}
.src{font-size:var(--fs-caption);color:var(--muted);margin:0;text-align:center}

.head{display:flex;flex-direction:column;gap:var(--s3)}
.head.center{align-items:center;text-align:center}

/* ===== Pills & section dividers ===== */
.pill{display:inline-block;background:var(--accent);color:var(--on-accent);
  padding:var(--s1) var(--s4);border-radius:var(--r-pill);
  font-size:var(--fs-pill);font-weight:700;letter-spacing:0}
.pill.ghost{background:var(--accent-soft);color:var(--accent)}
.section-divider{display:flex;flex-direction:column;align-items:center;gap:var(--s4);text-align:center}
.section-divider .s-head{font-size:var(--fs-section);font-weight:700;color:var(--ink);margin:0;line-height:var(--lh)}
.section-divider .s-head .accent{color:var(--accent)}

/* ===== Card ===== */
.card.has-band{padding-bottom:0;overflow:hidden}
.q{font-size:var(--fs-q);font-weight:700;color:var(--ink);margin:0;line-height:var(--lh)}
.q .mark{color:var(--accent);font-weight:700;margin-right:var(--s1)}

/* ===== Insight band (FIX 1: own --band-fill, correct in BOTH modes) ===== */
.band{margin:var(--s1) calc(-1 * var(--pad-card)) 0;background:var(--band-fill);color:var(--on-accent);
  padding:var(--s4) var(--s5);text-align:center;display:flex;flex-direction:column;gap:var(--s0);align-items:center}
.band .tag{font-size:13px;letter-spacing:.06em;color:var(--band-tag);font-weight:600}
.band .text{font-size:var(--fs-body);font-weight:700;line-height:var(--lh);margin:0}

/* ===== horizontal ranked bars ===== */
.hbars{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s3)}
.hbar{display:var(--recipe-layout-grid-display);grid-template-columns:1fr auto;gap:var(--s3);align-items:end}
.hbar .lab{font-size:15px;color:var(--recipe-text-primary-color);margin-bottom:var(--s1)}
.hbar .track{display:block;flex:0 0 auto;height:34px;border-radius:var(--r-pill);background:transparent}
.hbar .fill{height:100%;border-radius:var(--r-pill);background:var(--muted-soft);min-width:34px}
.hbar.active .fill{background:var(--recipe-surface-accent-background)}
.hbar .pct{font-size:16px;font-weight:700;color:var(--muted);align-self:end}
.hbar.active .pct{color:var(--accent)}
.hbar .cell{display:flex;flex-direction:column}

/* ===== C1 · vertical bar chart (height via --h) ===== */
.barchart{display:flex;align-items:flex-end;justify-content:space-around;gap:var(--s4);height:300px}
.barcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:var(--s2);flex:1;height:100%}
.barcol .bar{width:64px;border-radius:14px 14px 0 0;background:var(--muted-soft);height:var(--h);position:relative}
.barcol.active .bar{background:var(--accent)}
.barcol .val{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
.barcol.active .val{color:var(--accent)}
.barcol .xlab{font-size:13px;color:var(--muted)}
.barcol.active .xlab{color:var(--ink);font-weight:700}

/* ===== C1 · donut (conic-gradient; segments via --p1/--p2) ===== */
.donut{--p1:60%;--p2:82%;width:180px;height:180px;border-radius:50%;
  background:conic-gradient(var(--accent) 0 var(--p1),var(--muted-soft) var(--p1) var(--p2),var(--donut-3) var(--p2) 100%);
  display:var(--recipe-layout-grid-display);place-items:center;position:var(--recipe-geometry-relative-position);flex:0 0 auto}
.donut::before{content:"";position:absolute;width:108px;height:108px;border-radius:50%;background:var(--surface)}
.donut.on-canvas::before{background:var(--canvas)}
.donut .center{position:relative;font-size:26px;font-weight:700;color:var(--recipe-text-primary-color);font-family:var(--recipe-type-numeric-font-family)}
.legend{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s3)}
.legend .row{display:flex;align-items:center;gap:var(--s1);font-size:var(--fs-body)}
.legend .dot{width:12px;height:12px;border-radius:3px;flex:0 0 auto}

/* ===== C1 · line chart (geometry = data; styling tokenized) ===== */
.linechart{width:100%;height:260px;overflow:visible}
.linechart .ln-grid{stroke:var(--muted-soft);stroke-dasharray:4 6}
.linechart .ln-path{fill:none;stroke:var(--accent);stroke-width:3}
.linechart .ln-node{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.linechart .ln-val{font-size:14px;font-weight:700;fill:var(--ink);font-family:var(--font-latin)}
.linechart .ln-axis{font-size:13px;fill:var(--muted);font-family:var(--font-latin)}

/* ===== C1 · twin-bar / KPI result (uses --pos / --neg) ===== */
.kpibars{display:flex;align-items:flex-end;justify-content:center;gap:var(--s7);height:260px}
.kpibar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:var(--s2);height:100%}
.kpibar .bar{width:90px;border-radius:14px 14px 0 0;height:var(--h);background:var(--muted-soft);position:relative}
.kpibar.up .bar{background:var(--pos)} .kpibar.down .bar{background:var(--neg)}
.kpibar .val{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:700;color:var(--ink)}
.kpibar.up .val{color:var(--pos)} .kpibar.down .val{color:var(--neg)}
.kpibar .lab{font-size:14px;color:var(--muted)}
.delta{align-self:center;padding:var(--s1) var(--s4);border-radius:var(--r-pill);font-weight:700;font-size:18px}
.delta.up{background:var(--pos-soft);color:var(--pos)} .delta.down{background:var(--neg-soft);color:var(--neg)}

/* ===== C2 · metric ===== */
.metric{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s1)}
.metric .num{font-size:var(--fs-metric);font-weight:700;color:var(--ink);line-height:1.2}
.metric .num .unit{font-size:24px;color:var(--muted);font-weight:600}
.metric .cap{font-size:var(--fs-caption);color:var(--muted)}

/* ===== C3 · voice / persona + quote bubble ===== */
.persona{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s4)}
.persona .pname{font-size:26px;font-weight:700;color:var(--ink);margin:0}
.persona .prole{font-size:16px;color:var(--muted);margin:0}
.persona .pq{font-size:var(--fs-body);color:var(--muted);margin:0;max-width:300px}
.persona .pq .mark{color:var(--accent);font-weight:700}
.persona .pquote{font-size:18px;color:var(--ink);line-height:1.6;margin:0;max-width:320px}
.divider-s{width:44px;height:1px;background:var(--muted-soft)}
.qbubble{background:var(--chip);border:1px solid var(--muted-soft);border-radius:var(--r-sm);
  padding:var(--s2) var(--s3);font-size:14px;color:var(--ink);line-height:1.6;text-align:left}
.qbubble .who{display:block;font-size:11px;color:var(--muted);margin-bottom:var(--s0);letter-spacing:.05em}

/* ===== C4 · finding column + opportunity (L8) ===== */
.insightcol{display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.insightcol .find{background:var(--surface);border-radius:var(--r-card);padding:var(--s5);width:100%;
  display:flex;flex-direction:column;gap:var(--s3);text-align:center;min-height:360px}
.insightcol .find h3{font-size:22px;line-height:1.5;margin:0;color:var(--accent);font-weight:700}
.arrow-down{font-size:22px;color:var(--accent);font-weight:700}
.opp{background:var(--accent);color:var(--on-accent);border-radius:var(--r-card);padding:var(--s4);width:100%;
  text-align:center;display:flex;flex-direction:column;gap:var(--s1);align-items:center}
.opp .tag{background:rgba(255,255,255,.18);padding:var(--s0) var(--s3);border-radius:var(--r-pill);font-size:13px;font-weight:600}
.opp .label{font-size:18px;font-weight:700;line-height:1.5;margin:0}

/* ===== C5 · flow / node-chain ===== */
.flow{display:flex;align-items:center;gap:var(--s3);background:var(--surface);border-radius:80px;padding:var(--s4) var(--s5);flex-wrap:nowrap}
.flow-node{display:flex;flex-direction:column;align-items:center;gap:var(--s1);text-align:center;flex:0 0 auto}
.flow-node .node-pill{padding:var(--s2) var(--s4);border-radius:var(--r-pill);font-weight:700;font-size:17px;background:var(--muted-soft);color:var(--ink);white-space:nowrap}
.flow-node.active .node-pill{background:var(--accent);color:var(--on-accent)}
.flow-node .cap{font-size:12px;color:var(--muted);max-width:130px;line-height:1.5}
.flow-arrow{font-size:18px;color:var(--muted);flex:0 0 auto}
.flow-row{display:grid;grid-template-columns:170px 1fr;gap:var(--s5);align-items:center}
.flow-row .rlabel{font-size:24px;font-weight:700}
.flow-row .rlabel .rsub{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:var(--s1)}

/* ===== C6 · feature rows (stacked + headline) ===== */
.feature-rows{display:flex;flex-direction:column;gap:var(--s3)}
.feature-row{display:grid;grid-template-columns:1fr auto;gap:var(--s4);align-items:center;
  background:var(--surface);border:1px solid var(--muted-soft);border-radius:20px;padding:var(--s5);min-height:118px}
.feature-row.headline{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.feature-row h3{font-size:22px;margin:0;font-weight:700;line-height:1.4}
.feature-row p{margin:0;font-size:15px;color:var(--muted);line-height:1.6}
.feature-row.headline p{color:rgba(255,255,255,.85)}
.feature-row .ic{width:72px;height:72px;border-radius:var(--r-sm);background:var(--chip);
  border:1px solid var(--muted-soft);display:grid;place-items:center;font-size:28px;justify-self:end}
.feature-row.headline .ic{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18)}

/* ===== Bubble cluster ===== */
.bubbles{position:relative;width:100%;height:300px}
.bubble{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--on-accent);font-weight:700;padding:var(--s1)}
.bubble.muted{background:var(--muted-soft);color:var(--ink)}
.bubble.accent{background:var(--accent)}
.bubble .bl{font-size:16px;line-height:1.4}

/* ===== skill #tag chips (concrete examples, plain-language layer) ===== */
.chipcloud{display:var(--recipe-layout-row-display);flex-wrap:wrap;gap:12px}
.skill-chip{display:inline-flex;align-items:center;background:var(--chip);border:1px solid var(--muted-soft);border-radius:var(--r-pill);padding:10px 18px;font-size:16px;color:var(--recipe-text-primary-color);font-weight:600}
.skill-chip .h{color:var(--accent);margin-right:4px;font-weight:700}
.skill-chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.skill-chip.on .h{color:var(--on-accent)}

/* ===== section cover / 扉頁 (announce a new section) ===== */
/* dark inside a light deck is a background choice, not a mode switch */
.slide.section-cover{background:var(--band-fill);color:var(--on-accent)}
.section-cover .nav{display:flex;align-items:center;gap:18px;justify-content:center;font-size:18px;font-weight:700}
.section-cover .nav .item{color:rgba(255,255,255,.30)}
.section-cover .nav .item.on{color:var(--on-accent);border-bottom:3px solid var(--accent);padding-bottom:6px}
.section-cover .nav .sep{color:rgba(255,255,255,.18);font-size:14px}
.section-cover .lead-kicker{font-size:14px;letter-spacing:.16em;color:rgba(255,255,255,.6);font-weight:700}
.section-cover h1{font-size:54px;font-weight:700;margin:0}
.section-cover .sub{font-size:20px;color:rgba(255,255,255,.78);margin:0}

/* ===== numbered step flow (method / process: ①→②→③) ===== */
.stepflow{display:flex;align-items:stretch;gap:20px}
.step{flex:1;background:var(--surface);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:12px}
.step .num{font-size:42px;font-weight:700;color:var(--accent);line-height:1}
.step h3{margin:0;font-size:21px;font-weight:700;color:var(--ink)}
.step p{margin:0;font-size:16px;color:var(--muted);line-height:1.7}
.stepflow .arrow{align-self:center;font-size:30px;color:var(--accent);flex:0 0 auto}

/* ===== bilingual tag list  #Handle (中文)  ===== */
.taglist{font-size:15px;line-height:1.8}
.taglist .lbl{font-weight:700;color:var(--ink);margin-right:6px}
.taglist .h{color:var(--accent);font-weight:700}
.taglist .zh{color:var(--muted)}
.taglist .sep{color:var(--muted-soft);margin:0 4px}

/* ===== labeled rows with optional 2-track split (lifecycle/stage tables) ===== */
.lrow{display:grid;grid-template-columns:188px 1fr;gap:24px;align-items:start;padding:14px 20px;border-radius:12px}
.lrow.alt{background:var(--surface)}
.lrow .badge .k{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.lrow .badge h3{font-size:19px;margin:3px 0 0;font-weight:700;color:var(--ink)}
.lrow .split{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.lrow .track{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:4px}

/* ===== Wordmark (poster header) ===== */
.wordmark{display:flex;flex-direction:column;align-items:center;gap:var(--s2);text-align:center}
.wordmark .swoosh{width:54px;height:18px}
.wordmark .swoosh path{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round}
.wordmark h1{font-size:46px;font-weight:700;color:var(--ink);margin:0;letter-spacing:.01em}

/* ===== FIX 5 · tone modifiers (re-skin the single accent per slide intent) =====
   Still ONE chromatic color per slide — tone REPLACES accent, never adds to it.
   --pos / --neg appearing TOGETHER is allowed ONLY in a KPI/result chart. */
.slide.tone-pos{--accent:var(--pos);--accent-soft:var(--pos-soft)}
.slide.tone-neg{--accent:var(--neg);--accent-soft:var(--neg-soft)}
.slide.tone-warn{--accent:var(--warn);--accent-soft:var(--warn-soft)}

/* ===== citation-card (research evidence) ===== */
.citecard{background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s5);display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s2)}
.citecard .find{font-size:17px;color:var(--recipe-text-primary-color);line-height:1.7;margin:0}
.citecard .find .mark{color:var(--accent);font-weight:700}
.citecard .src{font-size:13px;color:var(--recipe-text-secondary-color);margin:0}

/* ===== callout band (HMW / key question) ===== */
.callout{background:var(--accent-soft);border-radius:var(--r-card);padding:var(--s5) var(--s6);text-align:center}
.callout .q{font-size:24px;color:var(--ink);font-weight:700;line-height:1.6;margin:0}
.callout .q .mark{color:var(--accent)}

/* ===== numbered-row (point + bilingual text + chart) ===== */
.numrow{display:var(--recipe-layout-grid-display);grid-template-columns:44px 1fr 1fr;gap:var(--s5);align-items:center}
.numrow .nbadge{width:32px;height:32px;border-radius:50%;background:var(--recipe-surface-accent-background);color:var(--recipe-text-on-accent-color);display:var(--recipe-layout-grid-display);place-items:center;font-weight:700;font-family:var(--font-latin)}
.numrow .ntext h3{font-size:22px;margin:0 0 var(--s1);color:var(--recipe-text-primary-color);font-weight:700;line-height:1.45}
.numrow .ntext .zh{font-size:15px;color:var(--recipe-text-secondary-color);line-height:1.7;margin:0}
.numrow .ntext .en{font-size:13px;color:var(--muted);line-height:1.6;margin:var(--s1) 0 0;opacity:.85}
.numrow .nchart{background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s4)}

/* ===== terminology-card (illustration + term + def) ===== */
.termcard{background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s5);display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s1);text-align:center}
.termcard .illus{height:120px;border-radius:var(--r-sm);background:var(--recipe-surface-soft-background);display:var(--recipe-layout-grid-display);place-items:center;margin-bottom:var(--s2)}
.termcard .illus svg{width:56px;height:56px;stroke:var(--accent);fill:none;stroke-width:2}
.termcard .kw{font-size:12px;color:var(--muted);letter-spacing:.08em;font-weight:700}
.termcard .term{font-size:20px;color:var(--recipe-text-accent-color);font-weight:700;margin:var(--s0) 0}
.termcard .def{font-size:15px;color:var(--recipe-text-secondary-color);line-height:1.7;margin:0}
.termcard.example{text-align:left;background:transparent;border:1px solid var(--muted-soft);gap:var(--s1)}
.termcard.example .kw{color:var(--accent)}
.termcard.example .def{color:var(--ink)}

/* ===== comparison-table (criteria x options, 1 focus column) ===== */
.ctable{width:var(--recipe-table-collapse-width);border-collapse:var(--recipe-table-collapse-border-collapse);font-size:17px}
.ctable th,.ctable td{padding:24px 16px;text-align:center;border-bottom:1px solid var(--muted-soft)}
.ctable thead th{color:var(--ink);font-weight:700;font-size:16px;border-bottom:2px solid var(--muted-soft)}
.ctable tbody th{text-align:left;color:var(--ink);font-weight:600}
.ctable td{color:var(--recipe-text-secondary-color)}
.ctable .yes{color:var(--ink);font-weight:700}
.ctable .no{color:var(--muted-soft)}
.ctable .fcol{background:var(--surface)}
.ctable thead .fcol{color:var(--accent);border-bottom:2px solid var(--accent)}
.ctable td.fcol.val{color:var(--recipe-text-accent-color);font-weight:var(--recipe-text-bold-font-weight)}

/* ===== delta-metric (big ±% + before/after bars) ===== */
.deltametric{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:8px}
.deltametric .hd{display:var(--recipe-layout-row-display);align-items:baseline;justify-content:space-between;gap:12px}
.deltametric .lab{font-size:16px;color:var(--recipe-text-primary-color);font-weight:700}
.deltametric .pct{font-size:40px;font-weight:700;font-family:var(--recipe-type-numeric-font-family);color:var(--recipe-text-accent-color);line-height:1}
.deltametric .legend-mini{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.deltametric .legend-mini .dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}

/* ===== logo-row (sources / tools / competitors) ===== */
.logorow{display:var(--recipe-layout-row-display);align-items:var(--recipe-layout-center-items-align-items);gap:var(--s3);flex-wrap:wrap;justify-content:center}
.logo{height:42px;min-width:62px;padding:0 14px;border-radius:var(--r-sm);background:var(--recipe-surface-neutral-background);border:1px solid var(--muted-soft);display:var(--recipe-layout-grid-display);place-items:center;color:var(--recipe-text-secondary-color);font-weight:700;font-family:var(--font-latin);font-size:14px}

/* ===== evidence-card (icon-stat / chart / logo-row) ===== */
.evcard{background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s5);display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);align-items:center;gap:var(--s3);text-align:center;min-height:300px;justify-content:center}
.evcard .figic{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.evcard .figic svg{width:32px;height:32px;stroke:var(--accent);fill:none;stroke-width:2}
.evcard .stat{font-size:40px;font-weight:700;color:var(--recipe-text-primary-color);font-family:var(--recipe-type-numeric-font-family)}
.evcard .cap{font-size:15px;color:var(--recipe-text-secondary-color);line-height:1.6}

/* ===== icon helper (inline open-source SVG, theme-colored via currentColor) ===== */
.icon{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:2;vertical-align:middle;flex:0 0 auto}
.icon.fill{fill:currentColor;stroke:none}
/* statement line: keep clauses whole, no orphan wrap, no terminal period */
.statement{font-weight:700;text-align:center;line-height:1.5;text-wrap:balance;max-width:1500px}
.nowrap{white-space:nowrap}
/* text wrapping — per modern-web-guidance: balance short headings, pretty body copy.
   Render env is Chromium 114+ so both are supported (degrade to normal wrap elsewhere). */
.headline,.section-divider .s-head,.callout .q,.q,.termcard .term,.section-cover h1{text-wrap:balance}
.sub,.meta,.numrow .ntext .zh,.feature-row p,.evcard .cap,.termcard .def,.citecard .find{text-wrap:pretty}

/* ============================================================
   v12 — Reference-audit primitives (built from a 38-slide capability audit).
   All token-based, flex/grid/%-positioned and re-screenshot-verified so they
   survive headless-Chrome export. Grouped by gap cluster.
   ============================================================ */

/* positioning context + z-layering helpers (used by leaders, decor, collages) */
.slide,.deck{overflow:hidden}
.canvas{position:relative}
.above{position:relative;z-index:1}

/* C1 — connector / leader layer ---------------------------------- */
/* SVG overlay: put <svg class="leader-svg"><path class="leader-line" …> inside a .canvas.
   Anchor paths to %-coords (viewBox 0 0 100 100, preserveAspectRatio="none") — never raw px. */
.leader-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.leader-line{fill:none;stroke:var(--muted-soft);stroke-width:.4;stroke-dasharray:1.2 1.4}
.leader-line.solid{stroke-dasharray:none}
.leader-line.accent{stroke:var(--accent)}
.leader-dot{fill:var(--accent)}
/* pure-CSS vertical tether: card → caption below it (most common, export-trivial) */
.vtether{width:0;height:var(--len,28px);border-left:2px dashed var(--muted-soft);margin:var(--s2) auto}
.vtether.accent{border-color:var(--accent)}

/* C2 — floating / overlap / edge-bleed decorative & hero layer ---- */
.decor-layer{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.decor-prop{position:absolute;transform:rotate(var(--rot,0deg)) scale(var(--scale,1))}
.hero-cutout{position:absolute;z-index:2} /* edge-anchor via inline top/right/bottom/left; may bleed off-slide */
.sticker{position:absolute;z-index:3}
.stage-backdrop{position:absolute;border-radius:50%;background:var(--accent-soft);z-index:0}
.bleed-shape{position:absolute;left:0;right:0;bottom:0;height:var(--h,260px);background:var(--accent-soft);border-radius:50% 50% 0 0/100% 100% 0 0;z-index:0}

/* C3 — speech-bubble tails + positioned annotation pins ----------- */
.tbubble{position:relative;background:var(--surface);border-radius:18px;padding:var(--s4) var(--s5);color:var(--ink)}
.tbubble::after{content:"";position:absolute;border:11px solid transparent}
.tbubble.t-down::after{top:100%;left:36px;border-top-color:var(--surface);border-bottom:0}
.tbubble.t-up::after{bottom:100%;left:36px;border-bottom-color:var(--surface);border-top:0}
.tbubble.t-left::after{right:100%;top:24px;border-right-color:var(--surface);border-left:0}
.tbubble.t-right::after{left:100%;top:24px;border-left-color:var(--surface);border-right:0}
.tbubble .react{position:absolute;font-size:30px;right:-10px;top:-18px;line-height:1}
.anno-pin{position:absolute;background:var(--chip);border-radius:var(--r-pill);padding:8px 16px;box-shadow:var(--shadow-pop);font-weight:700;font-size:15px;z-index:3}
.anno-pin.accent{background:var(--accent);color:var(--on-accent)}

/* C3b — cascade / scatter quote arrangements --------------------- */
.qcascade{display:flex;flex-direction:column;gap:var(--s4)}
.qcascade>*{max-width:68%}
.qcascade>*:nth-child(even){align-self:flex-end}
.collage{position:relative;width:100%;height:100%}
.collage>*{position:absolute} /* place via inline left/top/width; vary --rot for life */
.overhang{overflow:visible}
.overhang .badge-out{position:absolute;top:calc(-1*var(--s4));right:var(--s4);z-index:2}

/* C4 — bounded / nested panel containers ------------------------- */
.panel{border-radius:24px;background:var(--surface);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
.panel.bordered{background:transparent;border:1px solid var(--muted-soft)}
.splitpanel{border-radius:var(--r-card);overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.splitpanel .top{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);align-items:center;text-align:center}
.splitpanel .foot{background:var(--accent-soft);padding:var(--s5)}
.ab-panel{border-radius:var(--r-card);background:var(--surface);padding:var(--s6);display:flex;flex-direction:column;gap:var(--s4);height:100%}
.ab-panel.active{background:var(--accent-soft);outline:2px solid var(--accent)}
.statrail{display:flex;align-items:center;justify-content:space-between}
.split-2{display:grid;grid-template-columns:1fr 1px 1fr;gap:var(--s5);align-items:start}
.split-2 .rail{align-self:stretch;background:var(--muted-soft)}
.vrule{align-self:stretch;width:1px;background:var(--muted-soft)}

/* C5 — column-paired connectors + many-to-one convergence -------- */
.tracks{display:flex;gap:var(--gutter);align-items:stretch}
.track{flex:1;display:flex;flex-direction:column;gap:var(--s3)}
.track .arrow-down,.connector-down{align-self:center;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid var(--accent)}
.funnel-merge{display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.funnel-merge .nodes{display:flex;gap:var(--gutter);justify-content:center;width:100%}
.funnel-merge .wedge{width:64%;height:64px;background:var(--accent-soft);clip-path:polygon(0 0,100% 0,62% 100%,38% 100%)}
.mergenode{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:24px;font-weight:800;flex:0 0 auto}

/* C6 — combined bar+line chart + in-chart floating annotation ----- */
.barchart,.linechart{position:relative}
.barline{position:relative}
.barline .linechart{position:absolute;inset:0;pointer-events:none}
.ln-area{fill:var(--accent-soft);stroke:none}
.ln-path.alt{stroke:var(--muted-soft)}
.ln-drop{stroke:var(--muted);stroke-dasharray:1 1.4;stroke-width:.4;fill:none}
.chart-annot{position:absolute;z-index:2}
.barcol .cap-label{position:absolute;top:-26px;left:0;right:0;text-align:center;font-family:var(--font-latin);font-weight:800;font-size:18px;color:var(--ink)}

/* C7 — horizontal before/after + 2-bar delta presets ------------- */
.babars{display:flex;flex-direction:column;gap:var(--s4)}
.babars .r{display:grid;grid-template-columns:1fr auto;align-items:center;gap:var(--s4)}
.babars .lane{position:relative}
.babars .bar{height:46px;border-radius:var(--r-pill);width:var(--w,50%);display:flex;align-items:center;padding:0 var(--s4);color:var(--on-accent);font-weight:700}
.babars .bar.before{background:var(--muted-soft);color:var(--ink)}
.babars .bar.after{background:var(--accent)}
.babars .cap{text-align:right} .babars .cap b{display:block;font-family:var(--font-latin);font-size:22px;color:var(--ink)} .babars .cap span{font-size:13px;color:var(--muted)}
.deltametric.overline{text-align:center}
.axis-mid{position:absolute;top:0;bottom:24px;left:50%;width:0;border-left:1px dashed var(--muted-soft)}
.bubble-delta{display:flex;align-items:flex-end;gap:var(--s4)}
.bubble-delta .b{border-radius:50%;display:grid;place-items:center;font-family:var(--font-latin);font-weight:800}
.bubble-delta .b.before{background:var(--muted-soft);color:var(--ink)} .bubble-delta .b.after{background:var(--accent);color:var(--on-accent)}
.card.spread{justify-content:space-between}

/* C8 — device / phone mockups + multi-device stage --------------- */
/* A phone mock is a SCALED DEVICE, so its interior is measured in points, not px. --uis is one iOS
   point at this mock's size: a real iPhone is 390pt wide, so calc(width / 390) converts any Apple
   spec straight across. Nav bar 44pt, status inset 59pt, island 125x36pt, switch 51x31pt, body 17pt.
   Absolute px inside a phone is what makes a mockup look wrong at a glance - the frame shrinks and
   the type does not, so the proportions stop reading as a real screen. */
.phone{--uis:calc(var(--pw,300px)/390);width:var(--pw,300px);aspect-ratio:390/844;border:calc(var(--uis)*11) solid var(--ink);border-radius:calc(var(--uis)*54);background:var(--chip);position:relative;overflow:hidden;flex:0 0 auto}
/* Dynamic island: a floating pill inset from the top edge, not a notch cut into it. Current phones
   have looked like this for years and the old notch dates a mockup instantly. */
.phone .notch{position:absolute;top:calc(var(--uis)*11);left:50%;transform:translateX(-50%);width:calc(var(--uis)*125);height:calc(var(--uis)*36);background:var(--ink);border-radius:var(--r-pill);z-index:3}
.phone .screen,.appframe .screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.appframe{border-radius:24px;border:1px solid var(--muted-soft);background:var(--chip);position:relative;overflow:hidden;flex:0 0 auto}
.device-stack{position:relative;display:flex;align-items:flex-end;justify-content:center}
.device-stack>*+*{margin-left:calc(-1*var(--overlap,40px))}
.popup{position:absolute;z-index:4;background:var(--chip);border-radius:14px;box-shadow:var(--shadow-pop);padding:var(--s3) var(--s4)}
.listrow{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border-bottom:1px solid var(--muted-soft)}
.listrow .lr-end{margin-left:auto}
.toggle{width:44px;height:24px;border-radius:var(--r-pill);background:var(--muted-soft);position:relative;flex:0 0 auto}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--on-accent)}
.toggle.on::after{left:23px}

/* C9 — card arrangement variants & lifted count caps ------------- */
.cards.four{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gutter)}
.col-3{grid-column:span 3}
.card.flat{background:transparent;border:1px solid var(--muted-soft);box-shadow:none;padding:var(--s4)}
.cards.stagger>*:nth-child(even){margin-top:var(--s5)}
.qstack{display:flex;flex-direction:column;gap:var(--s3)}
.qcard{background:var(--chip);border-radius:var(--r-card);padding:var(--s4)}
.qcard .by{display:block;margin-top:6px;text-align:right;color:var(--muted);font-size:14px}
.col-badge{display:inline-flex;align-items:center;gap:8px}

/* C10 — dashed / dotted connector & decorative-thread variants ---- */
.dash-link{flex:1;align-self:center;height:0;border-top:2px dashed var(--muted-soft)}
.dash-link.accent{border-color:var(--accent)}
.node--dotted{border:2px dashed var(--muted-soft);border-radius:50%;background:transparent}
.thread{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}

/* C11 — flow-node extra states ----------------------------------- */
.flow-node .toplabel{font-size:14px;color:var(--muted);margin-bottom:6px;text-align:center}
.flow-node.dead .node-pill,.flow-node.dead .flow-pill{background:var(--muted);color:var(--on-accent)}

/* C12 — computed / proportion micro-components ------------------- */
.splitbar{display:flex;height:46px;border-radius:10px;overflow:hidden}
.splitbar-seg{display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-latin)}
.splitbar-seg.a{background:var(--accent);color:var(--on-accent)} .splitbar-seg.b{background:var(--muted-soft);color:var(--ink)}
.splitbar-labels{display:flex;margin-bottom:6px;font-size:14px;color:var(--muted)}
.formula{display:inline-flex;align-items:center;gap:var(--s4);font-family:var(--font-latin)}
.formula-circle{width:128px;height:128px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800}
.formula-op{font-size:34px;color:var(--muted);font-weight:700}
.needsrow{display:flex;align-items:center;padding-left:14px}
.needsbub{width:var(--size,76px);height:var(--size,76px);border-radius:50%;margin-left:-14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700;border:2px solid var(--chip)}

/* C13 — header / type / panel micro-features --------------------- */
.psubhead{font-size:15px;font-weight:700;color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:4px;display:inline-block}
.reaction{display:flex;align-items:center;gap:var(--s4)} .reaction .emoji{font-size:48px;line-height:1}
.statbox{border:2px dashed var(--muted-soft);border-radius:14px;padding:var(--s3) var(--s4);display:flex;gap:var(--s4)}
.statbox .cell{text-align:center} .statbox .cell b{display:block;font-family:var(--font-latin);font-size:24px;color:var(--accent)}
.bilingual-lead{display:grid;grid-template-columns:1fr 1fr;gap:var(--gutter)}
.bilingual-lead .en{color:var(--muted)}

/* C14 — radial dual-hub ecosystem map (idx 2) -------------------- */
.radialmap{position:relative;width:100%;height:100%}
.hub-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;z-index:2}
.hub-circle{position:absolute;width:var(--hs,220px);height:var(--hs,220px);border-radius:50%;background:var(--accent-soft);color:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:var(--s4);gap:6px}
.orbit-card{position:absolute;width:var(--ow,240px);background:var(--surface);border-radius:var(--r-card);padding:var(--s4)}
/* curved/dashed connectors for the map: reuse .leader-svg + .leader-line.curve over the .radialmap */

/* ============================================================
   v12.2 — Image / screenshot / mockup presentation
   RULE: every photo, screenshot, or UI mockup placed on a slide gets ROUNDED CORNERS
   + a SUBTLE LIGHT shadow (--shadow-img). The soft shadow lifts it, so a screenshot MAY
   float on the canvas (the shadow seats it) — it no longer needs a surface card behind it.
   Never a dark/heavy shadow. Use .shot to wrap a raw <img>; device/mockup frames carry it.
   ============================================================ */
.shot,.ui-mockup,.appframe,.mock,.mock2,.mock3{border-radius:var(--r-card)}
.shot{overflow:hidden;display:block;max-width:100%;background:var(--chip)}
.shot>img,.shot>video{display:block;width:100%;height:auto;border-radius:inherit}
.shot.sm{border-radius:var(--r-sm)}   /* smaller screenshots/thumbnails */

/* ===== timeline (Gantt: phase bars over a dated axis) — promoted from
   examples/light-timeline.html so the pattern can be rebuilt from base.css ===== */
.tl{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s4)}
.tl-axis{display:var(--recipe-layout-grid-display);grid-template-columns:repeat(5,1fr);font-size:13px;color:var(--recipe-text-secondary-color);border-bottom:1px solid var(--muted-soft);padding-bottom:var(--s2)}
.tl-bars{display:var(--recipe-layout-grid-display);grid-template-columns:repeat(5,1fr);gap:var(--s4);align-items:start}
.phase{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s3)}
.phase .bar{background:var(--band-fill);color:var(--on-accent);border-radius:var(--r-pill);padding:var(--s2) var(--s4);font-weight:700;font-size:16px;text-align:center}
.phase.active .bar{background:var(--accent)}
.phase ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--s1)}
.phase li{font-size:14px;color:var(--muted);display:flex;gap:8px}
.phase li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px;flex:0 0 auto}
.phase:nth-child(2){margin-top:var(--s5)} .phase:nth-child(3){margin-top:var(--s7)}
.phase:nth-child(4){margin-top:var(--s8)} .phase:nth-child(5){margin-top:calc(var(--s8) + var(--s4))}

/* ===== feature-card, feature-grid — promoted from examples/light-feature-grid.html ===== */
.fg{display:var(--recipe-layout-grid-display);grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--gutter)}
.fc{background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s5) var(--s6);display:var(--recipe-layout-row-display);align-items:center;gap:var(--s5)}
.fc .illus{width:76px;height:76px;border-radius:var(--r-sm);background:var(--recipe-surface-soft-background);display:var(--recipe-layout-grid-display);place-items:center;color:var(--accent);flex:0 0 auto}
.fc .illus svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:2}
.fc h4{margin:0 0 6px;font-size:20px;color:var(--recipe-text-primary-color)}
.fc p{margin:0;font-size:15px;color:var(--recipe-text-secondary-color);line-height:1.6}

/* ===== hero-radial — promoted from examples/light-hero-radial.html ===== */
.hr{display:var(--recipe-layout-grid-display);grid-template-columns:1fr 1.5fr 1fr;gap:var(--s6);align-items:center}
.sidecard{background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s5);display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s3)}
.sidecard h4{margin:0;font-size:18px;color:var(--accent)}
.sidecard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--s2)}
.sidecard li{font-size:15px;color:var(--muted);display:flex;gap:8px}
.sidecard li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px;flex:0 0 auto}
.radial{position:var(--recipe-geometry-relative-position);height:400px;display:var(--recipe-layout-grid-display);place-items:center}
.radial .core{width:160px;height:160px;border-radius:50%;background:var(--recipe-surface-accent-background);color:var(--recipe-text-on-accent-color);display:grid;place-items:center;text-align:center;font-weight:700;font-size:19px;line-height:1.4}
.radial .rl{position:absolute;font-size:14px;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--muted-soft);border-radius:var(--r-pill);padding:7px 16px}

/* ===== idea-evidence — promoted from examples/light-idea-evidence.html ===== */
.ie{display:var(--recipe-layout-grid-display);grid-template-columns:1fr 1fr;gap:var(--s8);align-items:stretch}
.ie .panel{background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s6);display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s4);justify-content:center}
.ie .idea h3{font-size:24px;margin:0;color:var(--ink);line-height:1.5}
.ie .idea h3 .accent{color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:var(--s4);height:170px;margin-top:var(--s2)}
.bars .b{flex:1;background:var(--muted-soft);border-radius:8px 8px 0 0}
.bars .b.on{background:var(--accent)}
.ie .note{font-size:14px;color:var(--recipe-text-secondary-color);line-height:1.7;margin:0}
.ie .ev .big{font-family:var(--recipe-type-numeric-font-family);font-size:80px;font-weight:700;color:var(--recipe-text-accent-color);line-height:1}
.ie .ev .big .u{font-size:34px}
.ie .ev p{font-size:16px;color:var(--muted);line-height:1.8;margin:0}

/* ===== interview-affinity — promoted from examples/light-interview-affinity.html ===== */
.ia{display:var(--recipe-layout-grid-display);grid-template-columns:repeat(3,1fr);gap:var(--gutter)}
.pcol{background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s5);display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s3)}
.pcol .ph{display:flex;align-items:center;gap:var(--s3)}
.pcol .av{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.pcol .av svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2}
.pcol h4{margin:0;font-size:18px;color:var(--recipe-text-primary-color)}
.pcol ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--s2)}
.pcol li{font-size:15px;color:var(--muted);line-height:1.6;display:flex;gap:8px}
.pcol li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px;flex:0 0 auto}
.insight{background:var(--recipe-surface-soft-background);border-radius:var(--r-card);padding:var(--s5) var(--s6);font-size:19px;color:var(--recipe-text-primary-color);font-weight:700;text-align:center}
.insight .mark{color:var(--accent)}

/* ===== keyword-cards — promoted from examples/light-keyword-cards.html ===== */
.kw{display:var(--recipe-layout-grid-display);grid-template-columns:repeat(3,1fr);gap:var(--gutter);align-items:center}
.kw .c{background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s7) var(--s6);display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s4);justify-content:center;min-height:340px}
.kw .lab{font-family:var(--font-latin);font-size:18px;font-weight:700;color:var(--accent)}
.kw h3{font-size:26px;line-height:1.45;margin:0;color:var(--recipe-text-primary-color)}
.kw p{font-size:16px;color:var(--recipe-text-secondary-color);line-height:1.8;margin:0}

/* ===== linked-circles — promoted from examples/light-linked-circles.html ===== */
.lc{display:var(--recipe-layout-row-display);align-items:var(--recipe-layout-center-items-align-items);justify-content:var(--recipe-layout-center-content-justify-content)}
.stadium{background:var(--surface);border-radius:240px;padding:var(--s8) var(--s8);display:flex;align-items:center;justify-content:center}
.circ{width:290px;height:290px;border-radius:50%;background:var(--recipe-surface-soft-background);display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);align-items:center;justify-content:center;gap:var(--s2);text-align:center;margin-left:-46px;border:1px solid var(--canvas)}
.circ:first-child{margin-left:0}
.circ .lab{font-family:var(--recipe-type-numeric-font-family);font-size:32px;font-weight:700;color:var(--recipe-text-accent-color)}
.circ .d{font-size:13px;color:var(--recipe-text-primary-color);line-height:1.6;max-width:180px}

/* ===== metric-card — promoted from examples/light-metric-cards.html ===== */
.mcrow{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gutter);align-items:center}
.mc{position:relative;background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s7) var(--s6);display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s2);justify-content:center;min-height:300px}
.mc .t{font-size:22px;color:var(--recipe-text-primary-color);font-weight:var(--recipe-text-bold-font-weight);line-height:1.45}
.mc .t .accent{color:var(--accent)}
.mc .d{font-size:15px;color:var(--recipe-text-secondary-color);line-height:1.7}
.mc .ic{position:absolute;top:var(--s5);right:var(--s5);color:var(--recipe-text-accent-color)}
.mc .ic svg{width:42px;height:42px;stroke:currentColor;fill:none;stroke-width:2}

/* ===== level-slider, persona-cards — promoted from examples/light-persona-cards.html ===== */
.pcard{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s4)}
.pcard .phead{display:flex;align-items:center;gap:var(--s4)}
.pcard .pavatar{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:0 0 auto}
.pcard .pavatar svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2}
.pcard .pid h3{margin:0;font-size:22px;color:var(--recipe-text-primary-color)}
.pcard .pid p{margin:2px 0 0;font-size:15px;color:var(--recipe-text-secondary-color)}
.pcard .ptag{margin-top:var(--s1)}

.pm{display:var(--recipe-layout-grid-display);grid-template-columns:1.2fr .8fr;gap:var(--s7);align-items:stretch}
.map{position:var(--recipe-geometry-relative-position);background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius)}
.map .ax-x{position:absolute;left:7%;right:7%;top:50%;height:2px;background:var(--muted-soft)}
.map .ax-y{position:absolute;top:7%;bottom:7%;left:50%;width:2px;background:var(--muted-soft)}
.map .lbl{position:absolute;font-size:13px;color:var(--recipe-text-secondary-color)}
.map .mk{position:absolute;transform:translate(-50%,-50%);font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.map .mk.me{color:var(--recipe-text-accent-color)}
.map .target{position:absolute;transform:translate(-50%,-50%);width:70px;height:70px;border:2px dashed var(--accent);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--accent)}
.ranks{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s4);justify-content:center}
.rank{display:var(--recipe-layout-grid-display);grid-template-columns:auto 1fr;gap:var(--s4);align-items:center;background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s4) var(--s5)}
.rank .n{font-family:var(--font-latin);font-size:15px;font-weight:700;color:var(--on-accent);background:var(--accent);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.rank h4{margin:0;font-size:18px;color:var(--recipe-text-primary-color)}
.rank p{margin:3px 0 0;font-size:14px;color:var(--recipe-text-secondary-color)}

.ps{display:var(--recipe-layout-grid-display);grid-template-columns:1fr 1fr;gap:var(--gutter)}
.ps .panel{border-radius:var(--r-card);padding:var(--s6);display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s4)}
.ps .problem{background:var(--surface)}
.ps .solution{background:var(--accent-soft)}
.ps .pbadge{align-self:flex-start;padding:6px 18px;border-radius:var(--r-pill);font-weight:700;font-size:16px}

.ps ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--s3)}
.ps li{display:flex;gap:var(--s2);font-size:17px;color:var(--recipe-text-secondary-color);line-height:1.6}
.ps li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:9px;flex:0 0 auto}
.ps .problem li::before{background:var(--muted)}

/* ===== cta-buttons, product-hero, ui-mockup — promoted from examples/light-product-hero.html ===== */
.nav{display:flex;align-items:center;justify-content:space-between}
.nav .brand{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:20px;color:var(--ink)}

.btn{padding:13px 26px;border-radius:var(--r-pill);font-weight:var(--recipe-text-bold-font-weight);font-size:16px}
.btn.primary{background:var(--ink);color:var(--canvas)}
.btn.secondary{background:transparent;border:1px solid var(--muted-soft);color:var(--recipe-text-primary-color)}
.stats{display:flex;gap:var(--s7);margin-top:var(--s6)}
.stats .s .v{font-family:var(--recipe-type-numeric-font-family);font-size:40px;font-weight:700;color:var(--recipe-text-primary-color);line-height:1}
.stats .s .l{font-size:14px;color:var(--muted);margin-top:4px}
.mock{background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s4);box-shadow:var(--shadow-card)}
.mock .bar{height:14px;border-radius:6px;background:var(--recipe-surface-muted-background);margin-bottom:10px}
.mock .row{display:flex;gap:10px;margin-bottom:10px}
.mock .chip{height:42px;border-radius:8px;background:var(--muted-soft);flex:1}
.mock .chip.on{background:var(--accent)}
.mock .big{height:160px;border-radius:10px;background:var(--recipe-surface-soft-background);margin-top:6px}

/* ===== results-grid — promoted from examples/light-results-grid.html ===== */
.aw{display:var(--recipe-layout-grid-display);grid-template-columns:minmax(0,500px) 1fr;gap:var(--s7);align-items:center}

/* ===== taglist, value-points — promoted from examples/light-value-points.html ===== */
/* Paired panels must be the same size and aligned, whatever they happen to contain. Laying each
   column out independently let the two grey rectangles end at different heights, which reads as an
   accident rather than a pair. The columns share one grid instead: `.pt` dissolves with
   display:contents so label, description and card each occupy a shared row, and the card row takes
   1fr so both cards start on the same line AND stretch to the same height. Content count stops
   deciding the geometry. */
.vp{display:var(--recipe-layout-grid-display);grid-template-columns:1fr 1fr;gap:var(--s8);align-items:stretch}
.vp>.pt{display:flex;flex-direction:column;gap:var(--s4);min-height:0}
/* the description is held to two lines so both cards START level, and the card then takes the rest
   of an equal-height column so they END level too */
.vp .desc{min-height:calc(1.8em * 2)}
.vp .card{flex:1;margin-top:0}
.vp .pt{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s4)}
.vp .lbl{font-size:24px;font-weight:700;color:var(--ink)}
.vp .lbl .dot{color:var(--accent)}
.vp .desc{font-size:16px;color:var(--recipe-text-secondary-color);line-height:1.8}
.vp .card{background:var(--recipe-surface-panel-background);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s6);margin-top:var(--s2)}
.vp .card .h{text-align:left;font-size:21px;font-weight:700;color:var(--ink);margin-bottom:var(--s5)}
.vp .card .h .accent{color:var(--accent)}
/* Everything inside a panel shares ONE alignment axis, so every element sits the same distance from
   the panel's left edge and the padding is the only inset the eye has to read. A centred heading over
   left-aligned chips gives the two no common axis, and the panel's left and right margins stop
   looking equal even though the padding is symmetric. Left-aligned also fixes the wrap: a single
   orphaned chip lines up under the first one instead of floating in the middle. */
.vp .chipcloud{justify-content:flex-start;gap:14px}

/* C14 — app-screen furniture + UI text scale --------------------- */
/* UI text is its own scale, separate from slide typography. Slide type runs 14-150px because it is
   read across a room; text drawn INSIDE a mock screen is read as an image of an interface, so it
   uses --fs-ui-1..5 (11/12/13/14/16px) with the line-height token of the same number. Size and
   line-height are paired; weight stays an independent choice (--fw-regular/medium/bold). Never set a
   raw px size on mock UI text — that is how a mockup drifts out of the system. */
/* Schematic only. These make a mock screen READ as an app without faking its data: real labels on
   the chrome that orients the viewer, skeleton bars everywhere content would be. The anatomy of a
   mobile screen is app bar, segmented control, list rows, sheet, banner, FAB — everything here is
   built from this system's own tokens, so a mockup always matches the deck's theme. */
/* The status area belongs to the device, not the app: reserve it so the island never lands on a
   title. Inside a .phone the bar clears the island; a plain .appframe has no island to clear. */
.appbar{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--muted-soft);background:var(--chip);flex:0 0 auto}
.phone .screen{font-size:calc(var(--uis)*17)}
.phone .appbar{padding:calc(var(--uis)*59) calc(var(--uis)*16) calc(var(--uis)*10);gap:calc(var(--uis)*10)}
.phone .appbar .title{font-size:1em}
.phone .appbar .back{width:.6em;height:.6em;border-width:calc(var(--uis)*2)}
.phone .appbar .act i{width:1.05em;height:1.05em}
.phone .tabbar span,.phone .segbar span{font-size:.765em}
.phone .banner{font-size:.765em;padding:calc(var(--uis)*8) calc(var(--uis)*12)}
.phone .badge{font-size:.65em;padding:calc(var(--uis)*2) calc(var(--uis)*8)}
.phone .listrow{padding:calc(var(--uis)*11) calc(var(--uis)*16);gap:calc(var(--uis)*10)}
.phone .toggle{width:calc(var(--uis)*51);height:calc(var(--uis)*31);flex:0 0 auto}
.phone .toggle::after{top:calc(var(--uis)*2);left:calc(var(--uis)*2);width:calc(var(--uis)*27);height:calc(var(--uis)*27)}
.phone .toggle.on::after{left:calc(var(--uis)*22)}
.phone .fab{right:calc(var(--uis)*16);bottom:calc(var(--uis)*16);width:calc(var(--uis)*56);height:calc(var(--uis)*56);font-size:calc(var(--uis)*26)}
.phone .sheet{border-radius:calc(var(--uis)*14) calc(var(--uis)*14) 0 0;padding:calc(var(--uis)*8) calc(var(--uis)*16) calc(var(--uis)*20)}
.appbar .title{font-size:var(--fs-ui-5);line-height:var(--lh-ui-5);font-weight:var(--fw-bold);color:var(--ink)}
.appbar .back{width:10px;height:10px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:0 0 auto}
.appbar .act{margin-left:auto;display:flex;gap:var(--s2)}
.appbar .act i{width:18px;height:18px;border-radius:var(--r-sm);background:var(--muted-soft);display:block}

.segbar{display:flex;gap:2px;padding:3px;border-radius:var(--r-pill);background:var(--muted-soft);flex:0 0 auto}
.segbar span{flex:1;text-align:center;font-size:var(--fs-ui-2);line-height:var(--lh-ui-2);font-weight:var(--fw-bold);color:var(--muted);padding:5px 10px;border-radius:var(--r-pill)}
.segbar span.on{background:var(--chip);color:var(--ink)}

.tabbar{display:flex;border-bottom:1px solid var(--muted-soft);flex:0 0 auto}
.tabbar span{flex:1;text-align:center;font-size:var(--fs-ui-3);line-height:var(--lh-ui-3);font-weight:var(--fw-bold);color:var(--muted);padding:var(--s2) 0;border-bottom:2px solid transparent}
.tabbar span.on{color:var(--ink);border-bottom-color:var(--accent)}

.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--chip);border-radius:20px 20px 0 0;box-shadow:var(--shadow-pop);padding:var(--s3) var(--s4) var(--s4);z-index:3}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:var(--r-pill);background:var(--muted-soft);margin:0 auto var(--s3)}

.banner{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);border-radius:var(--r-sm);background:var(--accent-soft);color:var(--ink);font-size:var(--fs-ui-2);line-height:var(--lh-ui-2)}
.banner.warn{background:var(--warn-soft)} .banner.neg{background:var(--neg-soft)} .banner.pos{background:var(--pos-soft)}

.fab{position:absolute;right:var(--s4);bottom:var(--s4);width:44px;height:44px;border-radius:50%;background:var(--accent);box-shadow:var(--shadow-pop);display:grid;place-items:center;color:var(--on-accent);font-size:22px;line-height:1;z-index:2}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--ink);font-size:var(--fs-ui-1);line-height:var(--lh-ui-1);font-weight:var(--fw-bold)}
.badge.dot{width:8px;height:8px;padding:0;background:var(--neg)}

/* C16 — panel title + unordered marker ---------------------------- */
/* A title sitting above a list or panel needs to read as a title. At 16px against 15px body it was
   only bold, not senior, so the group had no head. This is the role between .eyebrow and .headline. */
.panel-title{font-size:21px;line-height:1.5;font-weight:700;color:var(--ink);margin:0 0 var(--s3)}

/* A numbered badge is a CLAIM ABOUT ORDER: it says first, second, third. Use it for a sequence, a
   ranking, or steps that must happen in that order. When the items are peers - three features, three
   reasons, three principles - numbering invents a hierarchy the content does not have, and the reader
   spends a moment working out why item 1 outranks item 3. An icon carries meaning instead of rank. */
.rankrow .ic{width:30px;height:30px;border-radius:50%;background:var(--recipe-surface-soft-background);display:var(--recipe-layout-grid-display);place-items:center;flex:0 0 auto}
.rankrow .ic svg{width:17px;height:17px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* C17 — screen interiors: what goes INSIDE a mock frame ------------ */
/* C14 gives a mock its chrome, which says which PRODUCT it is. The interior says which SCREEN.
   An overview, a checkout and a settings page are each recognisable from across a room by their
   skeleton alone — one dominant number over a bar row; a form column against a fixed summary; a
   side rail with one item lit — so the arrangement carries the recognition and no invented data
   is needed to get it. That is the same reason C14 prefers .sk bars to tiny fake text, moved up
   from the content level to the layout level.
   Prefixed rather than bare (cf. .appbar/.listrow) so these add no new generic selectors.
   Shapes only: heights come off the UI type scale, fills are --muted-soft, and exactly one
   element per frame takes --accent as the thing the slide is about. */
.ui-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3);overflow:hidden}
.ui-split{display:grid;grid-template-columns:1fr var(--aside,36%);gap:var(--s3);flex:1;min-height:0}
.ui-col{display:flex;flex-direction:column;gap:var(--s2);min-height:0}
.ui-panel{background:var(--surface);border-radius:var(--r-sm);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);min-height:0}
.ui-field{height:calc(var(--fs-ui-4)*2);border-radius:var(--r-sm);background:var(--muted-soft);flex:0 0 auto}
.ui-fieldrow{display:flex;gap:var(--s2);flex:0 0 auto}
.ui-fieldrow .ui-field{flex:1}
.ui-cta{height:calc(var(--fs-ui-4)*2.2);border-radius:var(--r-pill);background:var(--accent);flex:0 0 auto;margin-top:auto}
.ui-metric{font-family:var(--font-latin);font-size:calc(var(--fs-ui-5)*1.9);line-height:1.1;font-weight:var(--fw-bold);color:var(--ink)}
.ui-bars{display:flex;align-items:flex-end;gap:var(--s1);flex:1;min-height:0}
.ui-bar{flex:1;background:var(--muted-soft);border-radius:var(--r-sm) var(--r-sm) 0 0;height:var(--h,50%)}
.ui-bar.on{background:var(--accent)}
.ui-tr{display:flex;align-items:center;gap:var(--s2);padding:var(--s2);border-radius:var(--r-sm);flex:0 0 auto}
.ui-tr.alt{background:var(--surface)}
.ui-tr.on{background:var(--accent-soft)}
.ui-tr .end{margin-left:auto}
.ui-rail{width:var(--rail,32%);background:var(--surface);border-right:1px solid var(--muted-soft);padding:var(--s2);display:flex;flex-direction:column;gap:var(--s1);flex:0 0 auto}
.ui-railitem{height:calc(var(--fs-ui-3)*1.9);border-radius:var(--r-sm);background:var(--muted-soft)}
.ui-railitem.on{background:var(--accent-soft)}
.ui-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s2);text-align:center;padding:var(--s4)}
.ui-empty .mark{width:calc(var(--fs-ui-5)*3.2);height:calc(var(--fs-ui-5)*3.2);border-radius:50%;background:var(--muted-soft);flex:0 0 auto}
.ui-matrix{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:var(--s2);flex:1;min-height:0}
.ui-cellbox{border:1px solid var(--muted-soft);border-radius:var(--r-sm);display:grid;place-items:center;padding:var(--s2)}
.ui-cellbox .pill{width:70%;height:calc(var(--fs-ui-3)*1.7);border-radius:var(--r-pill);border:1px solid var(--accent)}
.ui-cellbox.on .pill{background:var(--accent);border-color:transparent}

/* Feature showcase: schematic screen variant; does not override other device mockups. */
.fs{display:var(--recipe-layout-grid-display);grid-template-columns:1fr 1fr;gap:var(--s7);align-items:start;flex:1;min-height:0}
.fs .band{background:var(--band-fill);color:var(--on-accent);border-radius:var(--r-pill);padding:var(--s2) var(--s5);font-size:var(--fs-body);font-weight:700;margin:revert;text-align:revert;display:revert;flex-direction:revert;gap:revert;align-items:revert}
.fs .phone{background:var(--ink);border-radius:34px;padding:12px;width:300px;box-shadow:var(--recipe-image-card-elevation-box-shadow);aspect-ratio:revert;border:revert;position:revert;overflow:revert;flex:revert}
.fs .phone .scr{background:var(--canvas);border-radius:26px;padding:var(--s4);height:560px;display:flex;flex-direction:column;gap:14px}
.fs .phone .sk{background:var(--muted-soft);border-radius:6px;height:20px}
.fs .phone .big{background:var(--accent-soft);border-radius:12px;height:170px;margin:10px 0}
.fs .fs-anno{font-size:17px;color:var(--muted);line-height:1.7;text-align:center;max-width:340px}

/* Screen-interior gallery: reusable three-screen composition, scoped to .si. */
.si{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s6);align-items:stretch;flex:1;min-height:0}
.si .area{display:flex;flex-direction:column;min-height:0}
.si .appframe{width:100%;flex:1;min-height:0;box-shadow:var(--shadow-img)}
.si .cap{font-size:var(--fs-body);color:var(--muted);line-height:1.7;margin:var(--s4) 0 0;min-height:3.4em}
.si .cap b{color:var(--ink)}
.si .topbar{display:flex;align-items:center;gap:6px;padding:var(--s2) var(--s3);border-bottom:1px solid var(--muted-soft);background:var(--surface);flex:0 0 auto}
.si .topbar i{width:7px;height:7px;border-radius:50%;background:var(--muted-soft);display:block}
.si .topbar .addr{flex:1;height:12px;border-radius:var(--r-pill);background:var(--chip);margin-left:var(--s2)}
.si .split-screen{display:flex;flex-direction:row;flex:1;min-height:0}
.si .sk{height:9px;border-radius:5px}

/* Human-reviewed variants R51–R55 (2026-08-31); scope decisions to their pattern. */
/* R52 A: each value shares the same inset; fill never changes its text alignment. */
.aw .supp .row{padding-left:var(--s5);padding-right:var(--s5)}
.aw .supp .row:first-child{background:var(--accent-soft);border-radius:var(--r-card);padding-top:var(--s4);padding-bottom:var(--s4)}
.aw .supp .row:first-child .v{color:var(--ink)}
/* R53 A: intentional breathing room for a three-card metric composition. */
.mcrow.roomy .mc{min-height:430px;justify-content:center}
/* R54 B: row rules, with the separately highlighted comparison column retained. */
.ctable tbody tr{background:transparent}
/* R55 A: equal value-point labels and their evidence chips share one accent hue. */
.vp .pt .lbl{color:var(--accent)}
.vp .pt .dot{background:var(--accent)}
.vp .skill-chip{border-color:var(--accent);color:var(--accent)}

/* ===== C18 — annotated-screen: one built screen, its parts called out in place ===== */
/* A list of rules beside a screenshot makes the audience map text to location themselves. Pinning
   each note where it applies removes that work. .stage is the positioning context; pins take inline
   offsets the way .anno-pin already does, and a leader is a dashed rule rotated toward its anchor.
   Exactly one pin should carry .accent — the part the page is claiming something about.
   Device internals are scoped here, as .si and .fs .phone scope theirs. */
.ascr{display:var(--recipe-layout-row-display);align-items:stretch;justify-content:center;gap:var(--s8)}
.ascr .stage{position:var(--recipe-geometry-relative-position);flex:0 0 auto;align-self:center}
.ascr .phone{--pw:330px;box-shadow:var(--shadow-img)}
.ascr .scr{position:absolute;inset:0;background:var(--canvas);display:flex;flex-direction:column;gap:var(--s3);padding:var(--s5) var(--s4)}
.ascr .scr .appbar{display:flex;align-items:center;gap:var(--s3);padding-bottom:var(--s3);border-bottom:1px solid var(--muted-soft)}
.ascr .scr .appbar .back{width:10px;height:10px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);flex:0 0 auto}
.ascr .scr .appbar .ttl{height:13px;border-radius:7px;background:var(--ink);opacity:.75;width:52%}
.ascr .scr .hero{height:132px;border-radius:var(--r-sm);background:var(--muted-soft);opacity:.55}
.ascr .scr .sk{height:11px;border-radius:6px;background:var(--muted-soft);display:block}
.ascr .scr .cta{margin-top:auto;height:44px;border-radius:var(--r-sm);background:var(--accent)}
.ascr .pin{position:absolute;z-index:3;width:212px;background:var(--recipe-surface-panel-background);border:1px solid var(--muted-soft);border-radius:var(--recipe-surface-panel-border-radius);padding:var(--s3) var(--s4);box-shadow:var(--shadow-card)}
.ascr .pin .t{display:block;font-size:16px;font-weight:700;color:var(--recipe-text-primary-color);line-height:1.4}
.ascr .pin .d{display:block;font-size:13px;color:var(--recipe-text-secondary-color);line-height:1.55;margin-top:4px}
.ascr .pin.accent{border-color:var(--accent)}
.ascr .pin.accent .t{color:var(--accent)}
.ascr .leader{position:absolute;height:0;border-top:2px dashed var(--muted-soft);transform-origin:left center;z-index:2}
.ascr .leader.accent{border-color:var(--accent)}
.ascr .legend{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s5);max-width:400px;justify-content:space-around}
.ascr .legend .lrow{display:flex;gap:var(--s4);align-items:flex-start}
.ascr .legend .lnum{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--muted-soft);color:var(--ink);font-family:var(--font-latin);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.ascr .legend .lnum.on{background:var(--accent);color:var(--on-accent)}
.ascr .legend .ltext h4{margin:0;font-size:19px;color:var(--ink);line-height:1.4}
.ascr .legend .ltext p{margin:6px 0 0;font-size:15px;color:var(--muted);line-height:1.75}

/* ===== C19 — hidden-majority: the visible sliver above, the mass it hides below ===== */
/* A donut makes "1%" look trivial, which is the wrong reading when the other 99% simply has not
   arrived yet. Splitting one whole across a waterline inverts it: the small part is charged with
   warn, the submerged part keeps the dominant surface, and the waterline is labelled with what
   "so far" means. Same number, opposite conclusion — that inversion is the pattern. */
.hm{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:0}
.hm .above{position:var(--recipe-geometry-relative-position);display:flex;justify-content:center;align-items:flex-end;min-height:230px}
.hm .tip{width:200px;height:126px;background:var(--warn-soft);clip-path:polygon(50% 0,100% 100%,0 100%)}
.hm .above .fig{position:absolute;top:0;left:50%;margin-left:130px;text-align:left}
.hm .water{display:flex;align-items:center;border-top:2px dashed var(--muted-soft);padding-top:var(--s2)}
.hm .water .cap{margin-left:auto;font-size:14px;color:var(--recipe-text-secondary-color)}
.hm .below{position:relative;flex:1;min-height:0;background:var(--recipe-surface-soft-background);border-radius:var(--r-card);display:flex;align-items:stretch;padding:var(--s7)}
.hm .mass{position:absolute;left:50%;top:0;bottom:0;width:360px;margin-left:-180px;background:var(--accent);opacity:.62;clip-path:polygon(20% 0,80% 0,100% 24%,86% 60%,64% 100%,36% 100%,10% 64%,0 28%)}
.hm .fig .n{font-family:var(--recipe-type-numeric-font-family);font-weight:800;line-height:1;font-size:52px}
.hm .fig .l{font-size:15px;line-height:1.55;margin-top:var(--s2)}
.hm .above .fig .n,.hm .above .fig .l{color:var(--warn)}
.hm .below .fig{position:relative;z-index:2;align-self:flex-start}
.hm .below .note{position:relative;z-index:2;margin-left:auto;align-self:flex-end;max-width:320px;font-size:17px;line-height:1.8;color:var(--recipe-text-primary-color)}
.hm .below .note b{color:var(--accent)}
.hm .below .fig .n{font-size:66px;color:var(--recipe-text-accent-color)}
.hm .below .fig .l{color:var(--recipe-text-accent-color)}

/* ===== C20 — event-sequence: who sends what to whom, in order, and which stretch is the point =====
   Actors are columns, time runs down. Every layer (.cast, .lanes, .track, .pband) shares one column
   template and NO column gap, so an actor chip, its lifeline and every arrow endpoint land on the
   same centre. Chips get their own inline margin instead — a grid gap would shift the 1fr centres
   away from the lanes and the arrows would stop meeting the lifelines they point at. */
.seq{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);min-height:0}
.seq .cast,.seq .lanes,.seq .track,.seq .pband{display:grid;grid-template-columns:repeat(var(--seq-cols),1fr);column-gap:0}
.seq .cast{margin-bottom:var(--s3)}
.seq .actor{margin-inline:5px;background:var(--recipe-surface-neutral-background);border-radius:var(--r-chip);padding:var(--s2) var(--s1);text-align:center}
.seq .actor .n{font-weight:700;font-size:15px;line-height:1.3;color:var(--recipe-text-primary-color)}
.seq .actor .r{font-size:11px;line-height:1.35;margin-top:1px;color:var(--recipe-text-secondary-color)}
/* The track distributes its rows over the remaining height, so the diagram fills the canvas
   top-to-bottom instead of bunching under the cast. */
.seq .track{position:var(--recipe-geometry-relative-position);flex:1;min-height:0;align-content:space-between;row-gap:var(--s2)}
.seq .lanes{position:absolute;inset:0;pointer-events:none}
.seq .lane{justify-self:center;width:0;height:100%;border-left:1px dashed var(--muted-soft)}
/* A message spans --span columns starting at --from. The arrow is inset by half a column at each end
   so it runs centre-to-centre between the two lifelines rather than edge-to-edge across the span.
   .a must be block: as an inline span it collapses to zero width and only the arrowhead renders. */
.seq .msg{position:relative;z-index:1;grid-column:var(--from) / span var(--span);align-self:center}
.seq .msg .t{display:block;text-align:center;font-size:13px;line-height:1.4;padding:0 var(--s2) 4px;color:var(--recipe-text-primary-color)}
.seq .msg .a{display:block;position:relative;height:0;border-top:1.5px solid var(--muted);margin-inline:calc(100% / (2 * var(--span)))}
.seq .msg .a::after{content:"";position:absolute;top:-4.5px;right:-1px;width:0;height:0;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;border-left:7px solid var(--muted)}
.seq .msg.back .a::after{right:auto;left:-1px;border-left:0;border-right:7px solid var(--muted)}
/* An internal action: one actor doing something to itself, so it is a chip ON its lifeline rather
   than an arrow between two. It stays on a single column and overflows sideways, because centring it
   across two columns would park it in the gap between the lanes and point at neither. */
.seq .self{position:relative;z-index:1;grid-column:var(--from) / span 1;justify-self:center;align-self:center;white-space:nowrap;background:var(--recipe-surface-neutral-background);border:1px solid var(--muted-soft);border-radius:var(--r-pill);padding:4px 13px;font-size:12px;line-height:1.4;color:var(--recipe-text-secondary-color)}
/* The banded stretch is the argument: it spans the full track width and re-declares the same column
   template, so the messages inside stay on the lifelines they belong to. Named .pband, not .phase —
   .phase is already the roadmap column component and its nth-child margins would land on this. */
.seq .pband{grid-column:1 / -1;position:relative;z-index:1;row-gap:var(--s2);padding:var(--s2) 0 var(--s3);border-radius:var(--r-card);background:var(--recipe-surface-soft-background)}
.seq .pband .pl{grid-column:1 / -1;padding-left:var(--s4);margin-bottom:2px;font-size:12px;font-weight:700;color:var(--recipe-text-accent-color)}
.seq .pband .msg .t{color:var(--recipe-text-accent-color)}
.seq .pband .msg .a{border-top-color:var(--accent)}
.seq .pband .msg .a::after{border-left-color:var(--accent)}
.seq .pband .msg.back .a::after{border-right-color:var(--accent)}
.seq .pband .self{background:var(--chip);border-color:var(--accent-soft);color:var(--recipe-text-accent-color)}
/* muted-soft on accent-soft is invisible, and a band whose lifelines vanish reads as a gap in the
   sequence rather than an emphasised stretch of it. */
.seq .pband .lane{border-left-color:var(--accent)}

/* ===== C21 — system-anatomy: what the system is made of, what nests inside what, what passes between =====
   Peer blocks share the rail; the one that HOSTS a subsystem is wider and carries a tinted .grp, so
   containment is read from the nesting rather than from a label claiming it. Connectors are their own
   rail cells, not block borders, because a connector can carry two numbered steps travelling opposite
   ways between the same pair. */
.anat{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s4);min-height:0;background:var(--recipe-surface-neutral-background);border-radius:var(--r-card);padding:var(--s5)}
.anat .cap .n{font-weight:700;font-size:18px;line-height:1.35;color:var(--recipe-text-primary-color)}
.anat .cap .d{font-size:13px;line-height:1.5;margin-top:2px;color:var(--recipe-text-secondary-color)}
/* Blocks are centred, not stretched. Stretching every peer to the host's height leaves four tall
   white boxes holding two lines each — emptiness the layout did not ask for. The host is taller
   because it contains more, and that difference is information. */
.anat .rail{display:var(--recipe-layout-row-display);align-items:center;justify-content:center;flex:1;min-height:0}
.anat .blk{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:var(--s2);background:var(--chip);border-radius:var(--r-card);padding:var(--s4) var(--s3);text-align:center}
.anat .blk .n{font-weight:700;font-size:16px;line-height:1.35;color:var(--recipe-text-primary-color)}
.anat .blk .d{font-size:12px;line-height:1.5;color:var(--recipe-text-secondary-color)}
/* The host is wider only because it has to hold a whole subsystem legibly. It keeps the peers'
   surface: tinting it would claim the containment a second time, and the nesting already says it. */
.anat .blk.host{flex:1.7 1 0}
.anat .grp{margin-top:auto;display:flex;flex-direction:column;gap:var(--s2);background:var(--recipe-surface-soft-background);border-radius:var(--r-card);padding:var(--s3);text-align:left}
.anat .grp .gn{font-size:12px;font-weight:700;color:var(--recipe-text-accent-color)}
.anat .mem{background:var(--chip);border-radius:var(--r-chip);padding:var(--s2) var(--s3);text-align:center}
.anat .mem .n{font-weight:700;font-size:14px;line-height:1.35;color:var(--recipe-text-primary-color)}
.anat .mem .d{font-size:11px;line-height:1.45;color:var(--recipe-text-secondary-color)}
.anat .bidi{text-align:center;font-size:11px;line-height:1.4;color:var(--recipe-text-accent-color)}
/* A connector column. It can stack several .step children — a request and its response are two
   numbered steps between the same pair, and collapsing them into one arrow loses the round trip. */
.anat .link{flex:0 0 var(--anat-link,132px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);padding:0 var(--s1)}
.anat .step{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.anat .step .num{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--muted-soft);font-size:11px;font-weight:700;color:var(--recipe-text-primary-color)}
.anat .step .t{font-size:11px;line-height:1.4;color:var(--recipe-text-secondary-color)}
.anat .step .dir{font-size:15px;line-height:1;color:var(--muted)}

/* ===== C22 — role-thread: one problem travelling across roles until it is understood =====
   Each turn is attributed by a chip in its role's token colour, so the reader sees the handoff
   rather than a wall of quotes. One turn can expand into a structured card instead of a bubble:
   the moment a thread produces evidence, the evidence is the turn. */
.thr{display:var(--recipe-layout-column-display);flex-direction:var(--recipe-layout-column-flex-direction);gap:var(--s4)}
.thr .turn{display:var(--recipe-layout-row-display);gap:var(--s4);align-items:flex-start}
/* Four role tints, and no more. A fifth voice would have to reuse one, which is the signal that the
   thread has more participants than a single slide can attribute legibly. */
.thr .who{flex:0 0 66px;padding:6px 0;text-align:center;border-radius:var(--r-chip);font-size:13px;font-weight:700;background:var(--muted-soft);color:var(--recipe-text-primary-color)}
.thr .who.a{background:var(--accent-soft);color:var(--accent)}
.thr .who.w{background:var(--warn-soft);color:var(--warn)}
.thr .who.p{background:var(--pos-soft);color:var(--pos)}
.thr .who.n{background:var(--neg-soft);color:var(--neg)}
.thr .say{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.thr .lbl{font-size:13px;font-weight:700;line-height:1.4;color:var(--recipe-text-secondary-color)}
.thr .bub{background:var(--recipe-surface-neutral-background);border-radius:var(--r-card);padding:var(--s3) var(--s4);font-size:16px;line-height:1.7;color:var(--recipe-text-primary-color)}
.thr .bub b{color:var(--accent)}
/* The evidence card. It sits on .chip with a hairline so it reads as an artifact produced by the
   thread, not as another thing someone said. */
.thr .rcard{background:var(--chip);border:1px solid var(--muted-soft);border-radius:var(--r-card);padding:var(--s4)}
.thr .rcard .rh{font-weight:700;font-size:16px;line-height:1.4;color:var(--recipe-text-primary-color)}
.thr .rcard .rd{margin-top:4px;font-size:14px;line-height:1.6;color:var(--recipe-text-secondary-color)}
.thr .rcard .rl{margin-top:var(--s3);font-size:12px;font-weight:700;color:var(--recipe-text-secondary-color)}
.thr .path{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:6px}
.thr .pstep{background:var(--recipe-surface-neutral-background);border-radius:var(--r-pill);padding:5px 12px;font-size:13px;line-height:1.4;color:var(--recipe-text-primary-color)}
.thr .path .sep{font-size:12px;color:var(--muted)}
